name: CI Dev Local - Runner Smoke Test

# Smoke test PONTUAL de roteamento por label - NAO e um workflow de build/deploy.
# Objetivo unico: confirmar que um job com runs-on: [self-hosted, dev-local] e realmente
# pego pelo runner recem-registrado na maquina NDD-NOT-10024 (labels: self-hosted, Windows,
# X64, dev-local, homolog) e NUNCA pelo runner de producao WINSRV2022-LIB (sem essas labels).
# Sem side-effect: nao compila, nao publica, nao mexe em servico nem em secret.
#
# Disparo manual apenas (workflow_dispatch) - nao roda em push/PR de proposito, e so um
# smoke test de infraestrutura, nao um gate de CI.

on:
  workflow_dispatch:

# Disparo e sempre manual, mas mantido por paridade/consistencia com os demais workflows
# do repo - evita duas execucoes simultaneas empilhadas se alguem disparar 2x sem querer.
concurrency:
  group: ci-dev-local-smoketest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    # NUNCA adicionar a label 'production' aqui - o objetivo e forcar o roteamento
    # exclusivo para o runner dev-local (NDD-NOT-10024), nunca para WINSRV2022-LIB.
    runs-on: [self-hosted, dev-local]
    timeout-minutes: 5

    steps:
    - name: Checkout LayoutParserApi
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Confirmar roteamento e ambiente do runner
      run: |
        Write-Host "=== Roteamento ==="
        Write-Host "Runner name : $env:RUNNER_NAME"
        Write-Host "Hostname    : $env:COMPUTERNAME"
        Write-Host "Runner OS   : $env:RUNNER_OS"
        Write-Host "Runner arch : $env:RUNNER_ARCH"
        Write-Host "Labels esperadas: self-hosted, Windows, X64, dev-local, homolog"

        Write-Host ""
        Write-Host "=== Diretorio de trabalho ==="
        Write-Host "Workspace   : $env:GITHUB_WORKSPACE"
        Write-Host "PWD         : $($PWD.Path)"

        Write-Host ""
        Write-Host "=== .NET instalado ==="
        $dotnetCmd = Get-Command dotnet -ErrorAction SilentlyContinue
        if ($dotnetCmd) {
          Write-Host "dotnet encontrado em: $($dotnetCmd.Source)"
          dotnet --version
        } else {
          Write-Host "dotnet NAO encontrado no PATH deste runner."
        }

        Write-Host ""
        Write-Host "=== Git (checkout do repo) ==="
        git status
        git log -1

        Write-Host ""
        Write-Host "Smoke test concluido - se este job rodou, o roteamento por label 'dev-local' esta OK."
