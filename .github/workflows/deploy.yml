name: Deploy API to Production Server

on:
  push:
    branches:
      - main
      - master
    # Mudancas SEM efeito de runtime na API publicada NAO disparam deploy de producao:
    # docs/harness/memorias, markdown, metadados de repo e as pastas mcp/, ai/ e tools/
    # (excluidas do build da API via DefaultItemExcludes no .csproj e fora do publish).
    # Escape manual sempre disponivel via workflow_dispatch.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.rtk/**'
      - 'mcp/**'
      - 'ai/**'
      - 'tools/**'
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - '.dockerignore'
      - '.mcp.json.example'
      - '.github/workflows/ci-dev.yml'
  workflow_dispatch: # Permite executar manualmente

# Minimo necessario: checkout deste repo + LayoutParserLib/LayoutParserDecrypt (via
# GH_PAT_TOKEN, fora do escopo do GITHUB_TOKEN) - nenhum step comenta PR, cria release ou
# escreve outro recurso do GitHub. GITHUB_TOKEN so participa do proprio checkout.
permissions:
  contents: read

# Serializa deploys de producao. cancel-in-progress: false de PROPOSITO - cancelar um deploy
# no meio (durante a troca de binario / Stop-Service -> copia -> Start-Service) deixaria a
# instalacao pela metade. Runs concorrentes ENFILEIRAM; nenhum e abortado no meio do caminho.
#
# O grupo e uma constante ('deploy-prod'), NAO derivado de workflow+ref (github.workflow /
# github.ref) como nos demais workflows: este arquivo dispara por main, por master e por
# workflow_dispatch, e os tres publicam no MESMO host e no MESMO servico Windows. Agrupar por
# ref permitiria dois runs simultaneos disputando os mesmos binarios - e o step de copia falha
# com .exe/.dll em uso (hoje isso ABORTA o deploy, deixando a instalacao parcial). Constante
# serializa tudo que aponta para producao, que e a propriedade que interessa aqui.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Runner org LayoutParser no servidor de PRODUCAO (172.25.32.42 / WINSRV2022-LIB).
    # A label 'production' garante que o deploy NUNCA rode no runner de dev (label 'dev-local').
    runs-on: [self-hosted, windows, production]
    # environment: production da o rotulo do ambiente a este job. So vira BARREIRA (required
    # reviewer) depois que o environment 'production' for configurado no GitHub com reviewer
    # obrigatorio - config de UI, fora deste arquivo (ver pendencia repassada ao dono do repo).
    environment: production
    timeout-minutes: 60
    # SMTP_CONFIGURADO existe porque a context `secrets` NAO pode ser referenciada direto
    # dentro de uma expressao `if:` de step (restricao de plataforma do GitHub Actions,
    # ver actions/runner#520) - so e valida dentro de `env:`/`with:`. Os dois steps de
    # alerta por e-mail abaixo leem esta env var em vez de `secrets.SMTP_SERVER` no `if:`.
    env:
      SMTP_CONFIGURADO: ${{ secrets.SMTP_SERVER != '' }}

    steps:
    - name: Checkout LayoutParserApi
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: LayoutParserApi

    - name: Checkout LayoutParserLib
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: LayoutParser/layoutparser-lib
        path: layoutparser-lib
        token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Checkout LayoutParserDecrypt
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: LayoutParser/layoutparser-decrypt
        path: layoutparser-decrypt
        token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'
    
    - name: Setup MSBuild for .NET Framework
      # Pinado por SHA (tag mutavel proibida p/ Action de terceiro nao-imutavel - CodeQL
      # actions/unpinned-tag). SHA corresponde a tag v1.3.
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
    
    - name: Build LayoutParserLib (.NET Framework 4.8.1)
      run: |
        $WORK_DIR = $PWD.Path
        $LIB_DIR = Join-Path $WORK_DIR "layoutparser-lib"
        $LIB_PROJECT = Join-Path $LIB_DIR "LayoutParserLib.csproj"
        
        Write-Host "Compilando LayoutParserLib..."
        Write-Host "Diretorio: $LIB_DIR"
        Write-Host "Projeto: $LIB_PROJECT"
        
        if (-not (Test-Path $LIB_PROJECT)) {
          Write-Error "Projeto nao encontrado: $LIB_PROJECT"
          Write-Host "Conteudo do diretorio de trabalho:"
          Get-ChildItem -Path $WORK_DIR | Select-Object Name | Format-Table
          if (Test-Path $LIB_DIR) {
            Write-Host "Conteudo de LayoutParserLib:"
            Get-ChildItem -Path $LIB_DIR | Select-Object Name | Format-Table
          }
          exit 1
        }
        
        msbuild "$LIB_PROJECT" /p:Configuration=Release /p:Platform=AnyCPU /t:Restore,Build /verbosity:minimal
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao compilar LayoutParserLib"
          exit 1
        }
        
        Write-Host "LayoutParserLib compilado com sucesso"
    
    - name: Build LayoutParserDecrypt (.NET Framework 4.8.1)
      run: |
        $WORK_DIR = $PWD.Path
        $LIB_DIR = Join-Path $WORK_DIR "layoutparser-lib"
        $LIB_DLL = Join-Path $LIB_DIR "bin\Release\LayoutParserLib.dll"
        $DECRYPT_DIR = Join-Path $WORK_DIR "layoutparser-decrypt"
        $DECRYPT_PROJECT = Join-Path $DECRYPT_DIR "LayoutParserDecrypt.csproj"
        
        Write-Host "Compilando LayoutParserDecrypt..."
        Write-Host "Diretorio: $DECRYPT_DIR"
        Write-Host "Projeto: $DECRYPT_PROJECT"
        
        # Copiar DLL da lib para o diretorio do Decrypt
        if (Test-Path $LIB_DLL) {
          Copy-Item -Path $LIB_DLL -Destination $DECRYPT_DIR -Force
          Write-Host "LayoutParserLib.dll copiado para LayoutParserDecrypt"
        } else {
          Write-Warning "LayoutParserLib.dll nao encontrado em: $LIB_DLL"
          Write-Host "Verificando se LayoutParserLib foi compilado..."
          if (Test-Path $LIB_DIR) {
            Get-ChildItem -Path $LIB_DIR -Recurse -Filter "*.dll" | Select-Object FullName | Format-Table
          }
        }
        
        if (-not (Test-Path $DECRYPT_PROJECT)) {
          Write-Error "Projeto nao encontrado: $DECRYPT_PROJECT"
          if (Test-Path $DECRYPT_DIR) {
            Write-Host "Conteudo de LayoutParserDecrypt:"
            Get-ChildItem -Path $DECRYPT_DIR | Select-Object Name | Format-Table
          }
          exit 1
        }
        
        msbuild "$DECRYPT_PROJECT" /p:Configuration=Release /p:Platform=AnyCPU /t:Restore,Build /verbosity:minimal
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao compilar LayoutParserDecrypt"
          exit 1
        }
        
        Write-Host "LayoutParserDecrypt compilado com sucesso"
    
    # IMPORTANTE: buildar o .csproj EXPLICITAMENTE, nunca `dotnet build` sem argumento.
    # Na raiz do repo existem um .sln e um .csproj; o dotnet CLI resolve o comando sem
    # argumento pela SOLUTION. Desde que o projeto de testes entrou na LayoutParserApi.sln
    # (para o `dotnet test` deixar de mentir), um build pela solution passaria a restaurar
    # xUnit e compilar testes AQUI, em producao - uma falha de restore quebraria o deploy.
    # Producao compila exatamente o que PUBLICA: o projeto da API, e mais nada. O projeto de
    # testes tambem passa a ser compilado neste host, mas por um step proprio e explicito logo
    # abaixo (quality gate) - nunca por inferencia da solution, e nada dele entra no publish.
    - name: Build LayoutParserApi (.NET 10.0)
      run: |
        $WORK_DIR = $PWD.Path
        $API_DIR = Join-Path $WORK_DIR "LayoutParserApi"
        $API_PROJECT = Join-Path $API_DIR "LayoutParserApi.csproj"

        Write-Host "Compilando LayoutParserApi..."
        Write-Host "Projeto: $API_PROJECT"

        if (-not (Test-Path $API_PROJECT)) {
          Write-Error "Projeto nao encontrado: $API_PROJECT"
          Write-Host "Conteudo do diretorio de trabalho:"
          Get-ChildItem -Path $WORK_DIR | Select-Object Name | Format-Table
          if (Test-Path $API_DIR) {
            Write-Host "Conteudo de LayoutParserApi:"
            Get-ChildItem -Path $API_DIR | Select-Object Name | Format-Table
          }
          exit 1
        }

        dotnet restore "$API_PROJECT"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha no restore do LayoutParserApi"
          exit 1
        }

        dotnet build "$API_PROJECT" --configuration Release --no-restore
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao compilar LayoutParserApi"
          exit 1
        }

        Write-Host "LayoutParserApi compilado com sucesso"

    # -- Quality gate: suite de testes ANTES de tocar producao (FATAL) ----------------
    #
    # POR QUE ESTE STEP EXISTE: ate aqui SOMENTE o ci-dev.yml rodava `dotnet test`. Producao
    # buildava e publicava sem NUNCA executar a suite. O unico caminho que garantia o gate
    # (feat -> develop -> master via PR, com o ci-dev rodando no meio) deixou de ser obrigatorio
    # quando a branch protection nativa do GitHub foi perdida ao tornar os repos privados
    # (recurso pago no plano free - ver .claude/rules/agent-authority.md). Ou seja: um push
    # direto em master ia para PRODUCAO sem um unico teste ter rodado, e nada bloqueava.
    #
    # POSICAO: logo apos o build da API (a suite depende do LayoutParserLib.dll e do assembly da
    # API, compilados nos steps acima) e ANTES de qualquer step que escreva no host - publicacao
    # do runner low-code, Environment do servico, Stop-Service/copia de binarios. Falhar aqui
    # custa tempo de build; falhar depois custa producao pela metade: este workflow nao tem swap
    # atomico nem backup dos binarios anteriores.
    #
    # CONTRAPARTIDA ACEITA: este step restaura xUnit e compila o projeto de testes no host de
    # producao - justamente o que o comentario do step de build acima evita fazer por ACIDENTE
    # (build pela solution). Aqui e deliberado e escopado a UM csproj explicito; o publish
    # continua saindo so do LayoutParserApi.csproj.
    #
    # SEM BYPASS de proposito: nao ha input de workflow_dispatch para pular a suite. Deploy de
    # emergencia com teste vermelho e exatamente a situacao que este gate existe para impedir.
    - name: Quality gate - suite de testes (pre-producao)
      run: |
        $WORK_DIR = $PWD.Path
        $TEST_PROJECT = Join-Path $WORK_DIR "LayoutParserApi\tests\LayoutParserApi.Tests\LayoutParserApi.Tests.csproj"
        $RESULTS_DIR = Join-Path $WORK_DIR "test-results"
        $TRX = Join-Path $RESULTS_DIR "prod-gate.trx"

        if (-not (Test-Path $TEST_PROJECT)) {
          Write-Error "Projeto de testes nao encontrado: $TEST_PROJECT - deploy de PRODUCAO abortado (gate sem suite nao e gate)."
          exit 1
        }

        New-Item -ItemType Directory -Path $RESULTS_DIR -Force | Out-Null
        Remove-Item $TRX -Force -ErrorAction SilentlyContinue

        Write-Host "Executando a suite completa antes de tocar o host de producao..."
        dotnet test "$TEST_PROJECT" --configuration Release --logger "console;verbosity=minimal" --logger "trx;LogFileName=prod-gate.trx" --results-directory "$RESULTS_DIR"
        $testExit = $LASTEXITCODE

        # [ATENCAO] Exit code 0 NAO basta como veredito. Este repo ja teve um gate que mentia:
        # `dotnet test` pela solution reportava SUCESSO tendo executado ZERO teste (ver o
        # comentario do step "Testes (xUnit)" no ci-dev.yml). Por isso o veredito sai do TRX -
        # total/passed/failed - e a ausencia do relatorio e tratada como FALHA, nao como sucesso.
        if (-not (Test-Path $TRX)) {
          Write-Error "Relatorio TRX nao gerado em $TRX - impossivel confirmar que a suite rodou. Deploy de PRODUCAO abortado."
          exit 1
        }

        [xml]$relatorio = Get-Content $TRX -Raw
        $contadores = $relatorio.TestRun.ResultSummary.Counters
        if ($null -eq $contadores) {
          Write-Error "TRX sem ResultSummary/Counters ($TRX) - gate inconclusivo. Deploy de PRODUCAO abortado."
          exit 1
        }

        $total = [int]$contadores.total
        $passed = [int]$contadores.passed
        $failed = [int]$contadores.failed
        Write-Host "Suite: total=$total passed=$passed failed=$failed (exit do dotnet test: $testExit)"

        if ($testExit -ne 0 -or $failed -gt 0) {
          Write-Error "Teste(s) falharam ($failed de $total) - deploy de PRODUCAO abortado ANTES de qualquer alteracao no host."
          exit 1
        }

        if ($total -le 0) {
          Write-Error "A suite executou ZERO teste - gate inconclusivo, tratado como FALHA. Deploy de PRODUCAO abortado."
          exit 1
        }

        Write-Host "Quality gate verde: $passed/$total testes passaram - liberado a tocar producao."

    - name: Publish LayoutParserApi
      run: |
        $WORK_DIR = $PWD.Path
        $API_DIR = Join-Path $WORK_DIR "LayoutParserApi"
        $PROJECT_PATH = Join-Path $API_DIR "LayoutParserApi.csproj"
        $PUBLISH_OUTPUT = Join-Path $WORK_DIR "publish-api"
        
        Write-Host "Publicando LayoutParserApi..."
        Write-Host "Projeto: $PROJECT_PATH"
        Write-Host "Saida: $PUBLISH_OUTPUT"
        
        if (-not (Test-Path $PROJECT_PATH)) {
          Write-Error "Projeto nao encontrado: $PROJECT_PATH"
          exit 1
        }
        
        # Criar diretorio de saida se nao existir
        New-Item -ItemType Directory -Path $PUBLISH_OUTPUT -Force | Out-Null
        
        # Publicar com caminhos absolutos
        dotnet publish "$PROJECT_PATH" --configuration Release --output "$PUBLISH_OUTPUT"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao publicar LayoutParserApi"
          exit 1
        }
        
        Write-Host "LayoutParserApi publicado com sucesso em: $PUBLISH_OUTPUT"
    
    - name: Create deployment package
      run: |
        $WORK_DIR = $PWD.Path
        Write-Host "Criando pacote de deploy..."
        Write-Host "Diretorio de trabalho: $WORK_DIR"
        
        # Criar estrutura de deploy (apenas API)
        New-Item -ItemType Directory -Path deploy/api -Force | Out-Null
        
        # Copiar arquivos da API (do publish-api)
        Write-Host "Copiando arquivos da API..."
        $PUBLISH_API_PATH = Join-Path $WORK_DIR "publish-api"
        if (Test-Path $PUBLISH_API_PATH) {
          Copy-Item -Path "$PUBLISH_API_PATH\*" -Destination "deploy/api/" -Recurse -Force
          Write-Host "Arquivos copiados de: $PUBLISH_API_PATH"
        } else {
          Write-Error "Diretorio de publicacao nao encontrado: $PUBLISH_API_PATH"
          exit 1
        }
        
        # Copiar LayoutParserDecrypt.exe e DLLs
        Write-Host "Copiando LayoutParserDecrypt e dependencias..."
        $DECRYPT_EXE = Join-Path $WORK_DIR "layoutparser-decrypt\bin\Release\LayoutParserDecrypt.exe"
        $DECRYPT_DLL = Join-Path $WORK_DIR "layoutparser-decrypt\bin\Release\LayoutParserLib.dll"
        $LIB_DLL = Join-Path $WORK_DIR "layoutparser-lib\bin\Release\LayoutParserLib.dll"
        
        if (Test-Path $DECRYPT_EXE) {
          Copy-Item -Path $DECRYPT_EXE -Destination "deploy/api/" -Force
          Write-Host "  LayoutParserDecrypt.exe copiado de: $DECRYPT_EXE"
        } else {
          Write-Warning "  LayoutParserDecrypt.exe nao encontrado em: $DECRYPT_EXE"
        }
        
        if (Test-Path $DECRYPT_DLL) {
          Copy-Item -Path $DECRYPT_DLL -Destination "deploy/api/" -Force
          Write-Host "  LayoutParserLib.dll copiado de: $DECRYPT_DLL"
        } elseif (Test-Path $LIB_DLL) {
          Copy-Item -Path $LIB_DLL -Destination "deploy/api/" -Force
          Write-Host "  LayoutParserLib.dll copiado de: $LIB_DLL"
        } else {
          Write-Warning "  LayoutParserLib.dll nao encontrado em nenhum dos locais"
        }
        
        # Verificar estrutura
        Write-Host "`nEstrutura do deploy:"
        Get-ChildItem -Path deploy -Recurse -File | Select-Object FullName | ForEach-Object { Write-Host "  $($_.FullName)" }
        
        Write-Host "`nPacote de deploy criado com sucesso!"
    
    # -- Ambiente do servico (REG_MULTI_SZ) ------------------------------------------
    #
    # POR QUE ESTE STEP EXISTE: o step de deploy preserva o appsettings.json do destino
    # (mais abaixo, `-Exclude "appsettings.json"`). Consequencia: TODA chave de
    # configuracao nova adicionada ao appsettings.json do repositorio NUNCA chega ao
    # servidor - o codigo cai no default silenciosamente. O unico canal que funciona e a
    # variavel de ambiente `Section__Key` no Environment do servico Windows.
    #
    # DIFERENCA PARA O ci-dev.yml: la o CI e dono unico do Environment e o reescreve
    # inteiro. Aqui NAO - producao pode ter variaveis definidas manualmente (Database__Password,
    # por exemplo) que ninguem versionou. Este step faz UPSERT: reescreve so as chaves que
    # gerencia e PRESERVA todo o resto. Sobrescrever em bloco apagaria a senha do SQL.
    #
    # IdentityDatabase__Server/Database/UserId/Password: mesmo SQL Server dedicado de
    # identidade (172.25.32.5) usado pelo ci-dev.yml, injetado aqui pelo mesmo par de
    # secrets/variables (IDENTITY_DB_USERID/IDENTITY_DB_PASSWORD/IDENTITY_DB_SERVER/
    # IDENTITY_DB_NAME) - ver bloco no $managed logo abaixo.
    #
    # Roda ANTES do deploy de proposito: o servico e parado e reiniciado la, entao sobe ja
    # com o ambiente novo. Variavel de ambiente e lida no start do processo.

    # -- Publicacao do runner low-code (pasta Functions do repo) --------------------
    #
    # `LowCode:RunnerPath` historicamente apontava para `<deploy>\api\LayoutParserLowCodeRunner.exe`
    # e NENHUM workflow colocava o arquivo la - a config low-code ficava correta e inerte (issue
    # #373: execute-lowcode = 500 "runner .exe nao encontrado no host").
    #
    # O runner e net481/x86 e resolve dependencias pelo diretorio do PROPRIO .exe. Ate a issue
    # #391/#392 a unica pasta apta no host era a Bin de uma instancia AppConnector de TERCEIROS -
    # a pasta versionada `tools/LowCodeRunner/Functions/` carregava log4net 1.2.13.0 e estourava
    # em InstanceFactory.Initialize(). Com o #391/#392 essa pasta passou a ter log4net 2.0.17.0
    # ao lado de SysMiddle.Base.dll: virou um runtime home completo por si so.
    #
    # Este step copia `Functions/` INTEIRA (do checkout que o job ja faz) para
    # `<deploy>\api\lowcode-runner\`, preservando a estrutura, e resolve
    # LOWCODE_RUNNER_PATH_RESOLVED para o `.exe` nesse local - consumido pelo step de Environment
    # do servico logo abaixo (o appsettings.json do destino e preservado, entao esse caminho so
    # chega a API por variavel de ambiente). Nao depende mais de procurar uma Bin de terceiros.
    #
    # O diretorio `<deploy>\api\lowcode-runner` esta na allowlist do clean-deploy (step "Deploy to
    # server (local)") para nao ser removido como orfao logo em seguida.
    #
    # Nao e fatal: se a pasta Functions/ nao vier no checkout ou regredir o log4net, o step avisa
    # e segue - a API sobe, so o pathway low-code fica indisponivel. O smoke test do runner mais
    # abaixo (tambem nao-fatal) diz se ele realmente SOBE no host.
    - name: Publicar runner low-code (pasta Functions do repo)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')
        if ([string]::IsNullOrWhiteSpace($DEPLOY_PATH)) {
          Write-Warning "DEPLOY_PATH nao configurado - runner low-code nao sera publicado."
          exit 0
        }

        $runnerSrc = Join-Path $PWD.Path "LayoutParserApi\tools\LowCodeRunner\Functions"
        $runnerExe = Join-Path $runnerSrc "LayoutParserLowCodeRunner.exe"
        if (-not (Test-Path $runnerExe)) {
          Write-Warning "Runner nao encontrado no checkout: $runnerExe - pathway low-code seguira indisponivel."
          exit 0
        }

        # Discriminador binario da aptidao (verificado no repo apos issue #391/#392): a pasta
        # precisa ter SysMiddle.Base.dll E log4net 2.x ao lado do .exe. Se a pasta versionada
        # regredir, avisa e NAO publica - copiar uma pasta com log4net 1.x so produziria uma
        # falha em runtime (InstanceFactory.Initialize()), sem erro de deploy.
        $l4n = Join-Path $runnerSrc "log4net.dll"
        $l4nVer = if (Test-Path $l4n) { (Get-Item $l4n).VersionInfo.FileVersion } else { "(ausente)" }
        $temBase = Test-Path (Join-Path $runnerSrc "SysMiddle.Base.dll")
        if ((-not $temBase) -or ($l4nVer -notlike "2.*")) {
          Write-Warning "Functions/ nao esta apta (SysMiddle.Base.dll presente=$temBase, log4net=$l4nVer) - runner nao publicado."
          exit 0
        }

        $destino = Join-Path $DEPLOY_PATH "api\lowcode-runner"
        if (Test-Path $destino) { Remove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue }
        New-Item -ItemType Directory -Path $destino -Force | Out-Null
        Copy-Item -Path (Join-Path $runnerSrc "*") -Destination $destino -Recurse -Force

        $publicado = Join-Path $destino "LayoutParserLowCodeRunner.exe"
        if (-not (Test-Path $publicado)) {
          Write-Warning "Falha ao copiar o runner para $destino - pathway low-code seguira indisponivel."
          exit 0
        }
        $qtd = (Get-ChildItem $destino -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
        Write-Host "Runner low-code publicado em: $publicado ($qtd arquivos, log4net $l4nVer)"

        Add-Content -Path $env:GITHUB_ENV -Value "LOWCODE_RUNNER_PATH_RESOLVED=$publicado"

    # -- Config drift: repo x destino (DRY-RUN por padrao) ---------------------------
    #
    # O PROBLEMA ESTRUTURAL: o step de deploy copia com `-Exclude appsettings.json`, preservando o
    # arquivo do servidor. A intencao era boa (nao pisar em ajuste local), mas o efeito e que TODA
    # chave nova adicionada ao repositorio e silenciosamente ignorada em producao - o codigo cai no
    # default sem avisar ninguem. Isso nao e um bug: e uma fabrica de bugs. LowCode:Package,
    # RunnerTimeoutSeconds e ML:LowCodeTransformationsPath foram tres instancias do MESMO defeito.
    #
    # O ESTADO-ALVO (secao 3.1 do plano): inverter o default - o repo vira a fonte da verdade e o
    # destino sobrepoe pelo que e legitimamente local, via appsettings.Production.json (que tem
    # precedencia sobre o base e NAO e versionado) e variaveis de ambiente.
    #
    # POR QUE ESTE STEP NASCE EM DRY-RUN: ninguem sabe hoje o que diverge no .42 - o host nao aceita
    # SSH/WinRM/SMB, entao o conteudo do appsettings.json de producao nunca foi comparado com o do
    # repo. Inverter o default as cegas pode apagar ajuste local que sustenta a producao. Rodar
    # primeiro em modo relatorio produz exatamente o dado que falta para decidir, e custa um deploy.
    #
    # COMO EXECUTAR A MIGRACAO, depois de ler o relatorio:
    #   GitHub -> Settings -> Secrets and variables -> Actions -> aba Variables
    #   MIGRATE_CONFIG_TO_REPO = true
    # Com isso o step grava as divergencias em appsettings.Production.json no destino e libera a
    # copia do appsettings.json do repo. O appsettings.json antigo continua indo para Backups\ pelo
    # step de deploy, que ja fazia isso.
    - name: Config drift repo x destino (dry-run por padrao)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')
        $destino = Join-Path $DEPLOY_PATH 'api\appsettings.json'
        $repo = Join-Path $PWD.Path 'LayoutParserApi\appsettings.json'
        $migrar = ("${{ vars.MIGRATE_CONFIG_TO_REPO }}" -eq 'true')

        if (-not (Test-Path $destino)) {
          Write-Host "Sem appsettings.json no destino (primeiro deploy?) - nada a comparar."
          if ($migrar) { Add-Content -Path $env:GITHUB_ENV -Value "CONFIG_MIGRATED=true" }
          exit 0
        }
        if (-not (Test-Path $repo)) {
          Write-Warning "appsettings.json do repo nao encontrado em $repo - comparacao abortada."
          exit 0
        }

        # Achata o JSON em pares "Secao:Chave = valor" para comparar chave a chave.
        function Flatten($obj, $prefixo, $acc) {
          foreach ($p in $obj.PSObject.Properties) {
            $chave = if ($prefixo) { "$prefixo`:$($p.Name)" } else { $p.Name }
            if ($p.Value -is [PSCustomObject]) { Flatten $p.Value $chave $acc }
            else { $acc[$chave] = ($p.Value | ConvertTo-Json -Compress -Depth 10) }
          }
        }

        # Defesa em profundidade contra a causa raiz registrada em #112 (comentario de @lp-devops,
        # 2026-09-06): o appsettings.json do repo teve comentarios `// ...` (commit 0a2162b) e
        # ConvertFrom-Json nao aceita comentario - falhava silenciosamente sob continue-on-error,
        # deixando $mapaRepo vazio e o relatorio de drift mentiroso. O arquivo do repo ja foi
        # corrigido para JSON estrito (comentarios viraram chaves "_comment"), mas o parser aqui
        # fica tolerante de qualquer forma - remove linha que comeca (so espacos antes) com `//`,
        # o padrao usado neste repo. Nao mexe em `//` dentro de string de valor.
        function RemoverComentarios($caminho) {
          return ((Get-Content $caminho) | Where-Object { $_ -notmatch '^\s*//' }) -join "`n"
        }

        $mapaRepo = @{}; $mapaDestino = @{}
        Flatten (RemoverComentarios $repo | ConvertFrom-Json) '' $mapaRepo
        Flatten (RemoverComentarios $destino | ConvertFrom-Json) '' $mapaDestino

        # NUNCA ecoar valor de chave sensivel: o destino carrega Database:Password em texto plano.
        function EhSensivel($chave) {
          return ($chave -match '(?i)password|apikey|secret|token|connectionstring')
        }

        $divergentes = New-Object System.Collections.Generic.List[string]
        $soNoDestino = New-Object System.Collections.Generic.List[string]
        foreach ($chave in ($mapaDestino.Keys | Sort-Object)) {
          if (-not $mapaRepo.ContainsKey($chave)) { $soNoDestino.Add($chave); continue }
          if ($mapaDestino[$chave] -ne $mapaRepo[$chave]) { $divergentes.Add($chave) }
        }
        $soNoRepo = @($mapaRepo.Keys | Where-Object { -not $mapaDestino.ContainsKey($_) } | Sort-Object)

        Write-Host "=== Config drift: repo x destino ==="
        Write-Host "  Chaves no repo: $($mapaRepo.Count) | no destino: $($mapaDestino.Count)"
        Write-Host ""
        Write-Host "  [1] So no REPO (nunca chegaram ao servidor - o codigo usa o default):"
        if ($soNoRepo.Count -eq 0) { Write-Host "      (nenhuma)" } else { $soNoRepo | ForEach-Object { Write-Host "      $_" } }
        Write-Host ""
        Write-Host "  [2] DIVERGENTES (destino tem valor proprio - candidatas a appsettings.Production.json):"
        if ($divergentes.Count -eq 0) { Write-Host "      (nenhuma)" } else {
          $divergentes | ForEach-Object {
            if (EhSensivel $_) { Write-Host "      $_  (valor omitido: chave sensivel)" }
            else { Write-Host "      $_  repo=$($mapaRepo[$_])  destino=$($mapaDestino[$_])" }
          }
        }
        Write-Host ""
        Write-Host "  [3] So no DESTINO (config orfa ou removida do repo):"
        if ($soNoDestino.Count -eq 0) { Write-Host "      (nenhuma)" } else { $soNoDestino | ForEach-Object { Write-Host "      $_" } }
        Write-Host ""

        if (-not $migrar) {
          Write-Host "MODO DRY-RUN - nada foi alterado."
          Write-Host "Para migrar, defina a variable MIGRATE_CONFIG_TO_REPO=true e rode de novo."
          exit 0
        }

        # -- Migracao --
        # Preserva no appsettings.Production.json o que o destino tinha de proprio ([2] e [3]).
        # Production.json tem precedencia sobre o base, entao o comportamento efetivo nao muda -
        # o que muda e de onde vem o resto: passa a vir do repo, versionado e revisavel.
        #
        # [ATENCAO] EXCETO as secoes de subsistemas MORTOS. Medido no .42 em 2026-08-10: o appsettings de
        # producao ainda carrega Gemini:ApiKey, OpenAI:ApiKey e ElasticSearch:Password COM VALOR -
        # segredos de integracoes cujo codigo ja foi removido do repositorio (OpenAI em 9b0965f,
        # ElasticSearch em 2026-07-27, Gemini em aa54dc3). Preservar isso "porque diverge" copiaria
        # tres segredos vivos para um arquivo novo e os manteria em disco por mais um ciclo. A
        # migracao e a oportunidade de DESCARTA-LOS, nao de reancora-los.
        #
        # Elas nao sao apenas ignoradas: o relatorio abaixo diz quais foram descartadas, para que o
        # operador saiba exatamente quais segredos precisam ser revogados na origem.
        $secoesMortas = @('Gemini', 'OpenAI', 'ElasticSearch', 'Logging:Type', 'Logging:Txt')

        $preservar = @{}
        $descartadas = New-Object System.Collections.Generic.List[string]
        foreach ($chave in ($divergentes + $soNoDestino)) {
          $morta = $false
          foreach ($s in $secoesMortas) {
            if ($chave -eq $s -or $chave.StartsWith("$s`:", [StringComparison]::OrdinalIgnoreCase)) { $morta = $true; break }
          }
          if ($morta) { $descartadas.Add($chave); continue }
          $preservar[$chave] = $mapaDestino[$chave]
        }

        # [ATENCAO] GUARD-RAIL: segredo NAO vai para arquivo nenhum, nem para o Production.json.
        # Medido no .42: Database:Password diverge (o repo tem "") e o Environment do servico esta
        # VAZIO - ou seja, hoje a senha do SQL vem do appsettings.json em texto plano no disco.
        # Preservar essa chave "porque diverge" so trocaria o arquivo em que o segredo mora, e a
        # migracao teria gasto a unica chance de tira-lo do disco.
        #
        # Por outro lado, copiar o appsettings.json do repo (que tem Password vazio) SEM a senha
        # estar no Environment derruba o SQL de producao. Entao a migracao ABORTA e diz o que fazer.
        # Abortar e frustrante; migrar e quebrar a conexao com o banco e pior, e migrar mantendo o
        # segredo em disco e fingir que resolveu.
        $segredosDivergentes = @($preservar.Keys | Where-Object { EhSensivel $_ })
        if ($segredosDivergentes.Count -gt 0) {
          $envAtual = @()
          $cur = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\LayoutParserApi" -Name 'Environment' -ErrorAction SilentlyContinue).Environment
          if ($cur) { $envAtual = @($cur | ForEach-Object { ($_ -split '=', 2)[0] }) }

          $faltando = @()
          foreach ($s in $segredosDivergentes) {
            $envName = $s -replace ':', '__'
            if ($envAtual -notcontains $envName) { $faltando += $envName }
          }

          if ($faltando.Count -gt 0) {
            Write-Host "MIGRACAO ABORTADA - segredo em disco sem equivalente no ambiente do servico."
            Write-Host "  Provisione ANTES, no Environment do servico LayoutParserApi:"
            $faltando | ForEach-Object { Write-Host "      $_" }
            Write-Host "  (o valor atual esta no appsettings.json do destino; nao o copie para log nenhum)"
            Write-Host "  Feito isso, rode de novo com MIGRATE_CONFIG_TO_REPO=true."
            exit 0
          }

          # Ja estao no ambiente: saem do arquivo de config de vez.
          foreach ($s in $segredosDivergentes) { [void]$preservar.Remove($s) }
          Write-Host "  Segredos ja presentes no Environment - removidos da config em arquivo: $($segredosDivergentes -join ', ')"
        }

        if ($descartadas.Count -gt 0) {
          Write-Host "  [4] DESCARTADAS (subsistema morto - NAO vao para o Production.json):"
          $descartadas | ForEach-Object { Write-Host "      $_" }
          Write-Warning ("Chaves de subsistema morto sairam da config de producao. Se alguma for segredo " +
            "(Gemini/OpenAI/ElasticSearch), REVOGUE na origem: sair do disco nao invalida o valor que ja vazou.")
          Write-Host ""
        }

        $prod = @{}
        foreach ($chave in $preservar.Keys) {
          $partes = $chave -split ':'
          $no = $prod
          for ($i = 0; $i -lt $partes.Count - 1; $i++) {
            if (-not $no.ContainsKey($partes[$i])) { $no[$partes[$i]] = @{} }
            $no = $no[$partes[$i]]
          }
          $no[$partes[-1]] = ($preservar[$chave] | ConvertFrom-Json)
        }

        $prodPath = Join-Path $DEPLOY_PATH 'api\appsettings.Production.json'
        if (Test-Path $prodPath) {
          $bkp = Join-Path $DEPLOY_PATH "Backups\appsettings.Production-$(Get-Date -Format 'yyyyMMdd-HHmmss').json"
          New-Item -ItemType Directory -Path (Split-Path $bkp) -Force | Out-Null
          Copy-Item $prodPath $bkp -Force
          Write-Host "appsettings.Production.json existente salvo em: $bkp"
        }
        $prod | ConvertTo-Json -Depth 10 | Set-Content -Path $prodPath -Encoding UTF8
        Write-Host "MIGRACAO EXECUTADA: $($preservar.Count) chave(s) preservada(s) em $prodPath"
        Write-Host "  O appsettings.json do repo passa a ser copiado neste deploy."
        Add-Content -Path $env:GITHUB_ENV -Value "CONFIG_MIGRATED=true"

    - name: Configurar ambiente do servico (upsert, nao destrutivo)
      env:
        AI_METRICS_INGEST_KEY: ${{ secrets.AI_METRICS_INGEST_KEY }}
        IDENTITY_DB_SERVER: ${{ vars.IDENTITY_DB_SERVER }}
        IDENTITY_DB_NAME: ${{ vars.IDENTITY_DB_NAME }}
        IDENTITY_DB_USERID: ${{ secrets.IDENTITY_DB_USERID }}
        IDENTITY_DB_PASSWORD: ${{ secrets.IDENTITY_DB_PASSWORD }}
        DB_PASSWORD_PROD: ${{ secrets.DB_PASSWORD_PROD }}
      run: |
        $ErrorActionPreference = "Stop"
        $serviceName = "LayoutParserApi"
        $regPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"

        if (-not (Test-Path $regPath)) {
          Write-Warning "Servico $serviceName nao esta registrado neste host - nada a configurar."
          Write-Warning "A API roda aqui como servico Windows? Se roda de outra forma (IIS/console), o canal de config precisa ser revisto com @lp-devops."
          exit 0
        }

        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')
        if ([string]::IsNullOrWhiteSpace($DEPLOY_PATH)) {
          Write-Error "DEPLOY_PATH nao esta configurado! Configure o secret DEPLOY_PATH no GitHub."
          exit 1
        }

        # Chaves gerenciadas por este workflow (nome -> valor). Ordenado so para log estavel.
        $managed = [ordered]@{}

        # LowCode__Package: sem ele o runner low-code sai com exit 9 e NENHUMA transformacao
        # acontece. O valor vem de Instance_FiatMQ\AppConnector.DIR\Conf\config.xml (<PackageMappers>).
        # NAO e segredo - e um identificador de projeto Sysmiddle.
        $managed['LowCode__Package'] = '938f9978-836f-48c1-9c0f-c2898caf4b20'

        # LowCode__RunnerTimeoutSeconds: o default do codigo (15s) mata o processo no meio.
        # Medicao real: ExecuteMapper sozinho leva 38-73s e a transformacao completa 48-137s.
        # 180s da ~30% de folga sobre o pior caso medido. Ver comentario extenso no ci-dev.yml.
        $managed['LowCode__RunnerTimeoutSeconds'] = '180'

        # LowCode__RunnerPath: resolvido pelo step de publicacao do runner, logo acima (aponta para
        # <deploy>\api\lowcode-runner\LayoutParserLowCodeRunner.exe, a copia da pasta Functions/ do
        # repo). So entra no conjunto gerenciado quando o runner foi de fato publicado. Se nao foi,
        # a chave NAO e gerenciada - e, pela semantica de upsert deste step, um valor que ja exista
        # no destino (definido manualmente) e PRESERVADO em vez de apagado. Sobrescrever com vazio
        # aqui quebraria uma instalacao que alguem configurou a mao.
        if (-not [string]::IsNullOrWhiteSpace($env:LOWCODE_RUNNER_PATH_RESOLVED)) {
          $managed['LowCode__RunnerPath'] = $env:LOWCODE_RUNNER_PATH_RESOLVED
        } else {
          Write-Warning "Runner low-code nao publicado neste host - LowCode__RunnerPath nao sera gerenciado (valor existente, se houver, fica preservado)."
        }

        # ML__LowCodeTransformationsPath: o default cai em <api>\MLData\LowCodeTransformations,
        # ou seja, DENTRO da pasta que o deploy sobrescreve a cada release. Movido para fora,
        # ao lado do ML:LearningDataPath que ja e externo.
        $lowCodeStore = Join-Path $DEPLOY_PATH 'MLData\LowCodeTransformations'
        New-Item -ItemType Directory -Path $lowCodeStore -Force | Out-Null
        $managed['ML__LowCodeTransformationsPath'] = $lowCodeStore

        # AiMetrics__IngestApiKey: sem ela o AiMetricsIngestKeyFilter RECUSA toda escrita de
        # metricas de IA. Opcional - ausente, o resto do deploy segue normal.
        if (-not [string]::IsNullOrWhiteSpace($env:AI_METRICS_INGEST_KEY)) {
          $managed['AiMetrics__IngestApiKey'] = $env:AI_METRICS_INGEST_KEY
        } else {
          Write-Warning ("Secret AI_METRICS_INGEST_KEY ausente - a ingestao de metricas de IA continuara RECUSADA. " +
            "Crie em: GitHub -> Settings -> Secrets and variables -> Actions -> aba Secrets.")
        }

        # IdentityDatabase:* - SQL Server dedicado (172.25.32.5) para identidade/workspace,
        # substituindo o uso indevido do banco Sysmiddle ConnectUS_Macgyver (Error 1770 de FK
        # em SqlIdentityWorkspaceStore.cs). Server/Database vem de variables (nao sensiveis);
        # UserId/Password vem de secrets (NUNCA ecoar o valor). Mesmo mecanismo do ci-dev.yml,
        # mas aqui em upsert: se algum estiver ausente, a chave correspondente simplesmente NAO
        # entra em $managed - um valor ja configurado manualmente no destino fica PRESERVADO em
        # vez de apagado (mesma semantica de LowCode__RunnerPath acima).
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_SERVER)) {
          $managed['IdentityDatabase__Server'] = $env:IDENTITY_DB_SERVER
        } else {
          Write-Warning "Variable IDENTITY_DB_SERVER ausente - IdentityDatabase:Server nao sera gerenciada (valor existente, se houver, fica preservado)."
        }
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_NAME)) {
          $managed['IdentityDatabase__Database'] = $env:IDENTITY_DB_NAME
        } else {
          Write-Warning "Variable IDENTITY_DB_NAME ausente - IdentityDatabase:Database nao sera gerenciada (valor existente, se houver, fica preservado)."
        }
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_USERID)) {
          $managed['IdentityDatabase__UserId'] = $env:IDENTITY_DB_USERID
        } else {
          Write-Warning "Secret IDENTITY_DB_USERID ausente - IdentityDatabase:UserId nao sera gerenciada (valor existente, se houver, fica preservado)."
        }
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_PASSWORD)) {
          $managed['IdentityDatabase__Password'] = $env:IDENTITY_DB_PASSWORD
        } else {
          Write-Warning ("Secret IDENTITY_DB_PASSWORD ausente - IdentityDatabase:Password nao sera gerenciada (valor existente, se houver, fica preservado). " +
            "Sem ela e sem valor manual no destino, a API sobe fail-closed negando UserId. " +
            "Crie em: GitHub -> Settings -> Secrets and variables -> Actions -> aba Secrets.")
        }

        # Database__Password: fecha o pre-requisito #1 registrado na issue #112 (comentario de
        # @lp-devops, 2026-09-06) para ativar vars.MIGRATE_CONFIG_TO_REPO=true. O guard-rail de
        # segredo do step "Config drift" aborta a migracao enquanto Database:Password divergir do
        # repo (repo tem "") e NAO existir Database__Password no Environment do servico - hoje a
        # senha do SQL (172.31.249.51, credencial compartilhada org-wide, ver
        # .claude/rules/security.md) so existe em texto plano no appsettings.json do disco.
        #
        # O valor NAO pode ser obtido por este workflow (host de producao sem SSH/WinRM/SMB) nem
        # inventado por um agente - precisa ser o mesmo valor ja em uso, provisionado manualmente
        # pelo dono do projeto como secret DB_PASSWORD_PROD. Enquanto o secret nao existir, esta
        # chave simplesmente NAO entra em $managed (mesma semantica de upsert das demais acima) -
        # nada muda no Environment e a senha continua vindo do appsettings.json ate a migracao
        # ser desbloqueada.
        if (-not [string]::IsNullOrWhiteSpace($env:DB_PASSWORD_PROD)) {
          $managed['Database__Password'] = $env:DB_PASSWORD_PROD
        } else {
          Write-Warning ("Secret DB_PASSWORD_PROD ausente - Database__Password nao sera gerenciada. " +
            "E pre-requisito para ativar vars.MIGRATE_CONFIG_TO_REPO=true (issue #112): crie o secret " +
            "com o MESMO valor de senha ja em uso hoje (nao e rotacao) em GitHub -> Settings -> " +
            "Secrets and variables -> Actions -> aba Secrets.")
        }

        # Kestrel__Endpoints__Http__Url: TRAVA DE REDE (2026-08-12, plano em
        # docs/architecture/rollout-p2-autenticacao.md, "ACOPLAMENTO LETAL"). O default do
        # appsettings.json/Program.cs e "http://0.0.0.0:5000" - todas as interfaces. Com o
        # TrustedIdentityMiddleware passando a confiar em x-iis-user/x-iis-roles injetados pelo
        # BFF, uma API em 0.0.0.0 deixa QUALQUER host da rede se passar por qualquer usuario
        # direto na :5000, pulando o BFF e o Entra OIDC por completo - a guarda de loopback do
        # middleware neutraliza isso, mas so a rede fecha a origem por completo (defesa em
        # profundidade, nao redundancia).
        #
        # Por que via env var (canal gerenciado) e nao editando o appsettings.json do repo: este
        # workflow copia com `-Exclude appsettings.json` por padrao (ver step "Config drift" acima)
        # - o valor do repo so chega ao destino se MIGRATE_CONFIG_TO_REPO=true ja tiver rodado, o
        # que nao e garantido. A variavel de ambiente do servico e o UNICO canal que sempre chega,
        # independente do estado da migracao - mesmo padrao ja usado para LowCode__Package etc.
        #
        # PRE-REQUISITO verificado antes deste commit: o painel React de producao ja fala com o
        # BFF (branch codex/feat-entra-oidc), nao mais direto com a :5000 - confirmado pelo dono.
        # BFF e API sao co-hospedados no mesmo Windows Server 2022 (172.25.32.42,
        # BRNDDAPPBLD01) - o smoke test abaixo roda no runner self-hosted DESTE MESMO host, entao
        # localhost/127.0.0.1 continua alcancavel apos o bind mudar.
        $managed['Kestrel__Endpoints__Http__Url'] = 'http://127.0.0.1:5000'

        # Upsert: preserva tudo que nao e nosso, reescreve o que e.
        $existing = @()
        $cur = (Get-ItemProperty -Path $regPath -Name 'Environment' -ErrorAction SilentlyContinue).Environment
        if ($cur) { $existing = @($cur) }

        $resultado = New-Object System.Collections.Generic.List[string]
        $preservadas = New-Object System.Collections.Generic.List[string]
        foreach ($entrada in $existing) {
          if ([string]::IsNullOrWhiteSpace($entrada)) { continue }
          $chave = ($entrada -split '=', 2)[0]
          if ($managed.Contains($chave)) { continue }   # sera reescrita logo abaixo
          $resultado.Add($entrada)
          $preservadas.Add($chave)
        }
        foreach ($chave in $managed.Keys) { $resultado.Add("$chave=$($managed[$chave])") }

        # NUNCA ecoar valores: so nomes de chave. (O Actions mascara secrets, mas o
        # Environment tambem carrega valores que nao passaram por secret.)
        Set-ItemProperty -Path $regPath -Name 'Environment' -Value ([string[]]$resultado) -Type MultiString
        Write-Host "Ambiente do servico atualizado."
        Write-Host "  Gerenciadas por este workflow: $($managed.Keys -join ', ')"
        if ($preservadas.Count -gt 0) {
          Write-Host "  Preservadas (definidas fora do CI): $($preservadas -join ', ')"
        } else {
          Write-Host "  Preservadas (definidas fora do CI): nenhuma"
        }

    # -- Backup pre-deploy do binario atual (rollback automatico) --------------------
    #
    # POR QUE ESTE STEP EXISTE: incidente de 2026-08-15 (PR #114) - o smoke test de readiness
    # falhou 24x apos o deploy, o workflow abortou (exit 1), mas o servico Windows ja tinha sido
    # parado/reiniciado com o binario NOVO quebrado - producao ficou no ar crashada ate
    # intervencao manual. Ate aqui nao havia NENHUM backup versionado do binario anterior; so o
    # appsettings.json era copiado para Backups\ (step "Deploy to server (local)" abaixo).
    #
    # Este step copia o diretorio `api` inteiro (o binario que esta rodando AGORA, antes de ser
    # sobrescrito) para `backups\pre-deploy-<timestamp>\api`. Mesmo disco, custo baixo. O smoke
    # test de readiness (mais abaixo) restaura daqui se a versao nova falhar.
    #
    # Roda ANTES de "Deploy to server (local)" de proposito: precisa capturar o binario ainda
    # intacto, antes do Stop-Service/copia que o sobrescreve.
    - name: Backup pre-deploy do binario atual (para rollback)
      run: |
        $ErrorActionPreference = "Stop"
        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')

        if ([string]::IsNullOrWhiteSpace($DEPLOY_PATH)) {
          Write-Error "DEPLOY_PATH nao esta configurado! Configure o secret DEPLOY_PATH no GitHub."
          exit 1
        }

        $DEPLOY_API_PATH = Join-Path $DEPLOY_PATH "api"
        $BACKUPS_ROOT = Join-Path $DEPLOY_PATH "backups"

        if (-not (Test-Path $DEPLOY_API_PATH)) {
          Write-Host "Nenhuma instalacao anterior em $DEPLOY_API_PATH - primeiro deploy, sem binario para fazer backup."
          exit 0
        }

        New-Item -ItemType Directory -Path $BACKUPS_ROOT -Force | Out-Null
        $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
        $geracaoPath = Join-Path $BACKUPS_ROOT "pre-deploy-$timestamp"
        $destino = Join-Path $geracaoPath "api"
        New-Item -ItemType Directory -Path $geracaoPath -Force | Out-Null

        Write-Host "Copiando binario atual para backup: $DEPLOY_API_PATH -> $destino"
        Copy-Item -Path $DEPLOY_API_PATH -Destination $destino -Recurse -Force

        # Registrado no ambiente do JOB (nao do servico) para o step de smoke test - mais abaixo,
        # na MESMA execucao - encontrar direto o backup sem precisar redescobrir pelo nome.
        Add-Content -Path $env:GITHUB_ENV -Value "PRE_DEPLOY_BACKUP_PATH=$destino"
        Write-Host "Backup pre-deploy concluido: $destino"

        # Retencao: mantem so as ultimas 5 geracoes - disco nao acumula indefinidamente.
        $geracoes = Get-ChildItem -Path $BACKUPS_ROOT -Directory -Filter 'pre-deploy-*' -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending
        if ($geracoes.Count -gt 5) {
          $antigas = $geracoes | Select-Object -Skip 5
          foreach ($g in $antigas) {
            Write-Host "Removendo geracao antiga de backup: $($g.FullName)"
            Remove-Item -Path $g.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Deploy to server (local)
      run: |
        $ErrorActionPreference = "Stop"
        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}"
        
        # Validar se DEPLOY_PATH esta configurado
        if ([string]::IsNullOrWhiteSpace($DEPLOY_PATH)) {
          Write-Error "DEPLOY_PATH nao esta configurado! Configure o secret DEPLOY_PATH no GitHub."
          exit 1
        }
        
        # Normalizar caminho (remover aspas se houver)
        $DEPLOY_PATH = $DEPLOY_PATH.Trim('"', '''', ' ')
        
        # Obter caminho absoluto do diretorio de trabalho
        $WORK_DIR = $PWD.Path
        $DEPLOY_SOURCE = Join-Path $WORK_DIR "deploy"
        $DEPLOY_API_SOURCE = Join-Path $DEPLOY_SOURCE "api"
        
        Write-Host "Iniciando deploy da API no servidor..."
        Write-Host "Caminho de deploy (DEPLOY_PATH): $DEPLOY_PATH"
        Write-Host "Diretorio de trabalho: $WORK_DIR"
        Write-Host "Pacote de deploy: $DEPLOY_SOURCE"
        Write-Host "Pacote API: $DEPLOY_API_SOURCE"
        Write-Host "Runner: Self-hosted (executando localmente)"
        Write-Host "Servidor: 172.25.32.42"
        
        # Verificar se o pacote de deploy existe
        if (-not (Test-Path $DEPLOY_API_SOURCE)) {
          Write-Error "Diretorio de deploy nao encontrado: $DEPLOY_API_SOURCE"
          Write-Host "Conteudo do diretorio de trabalho:"
          Get-ChildItem -Path $WORK_DIR | Select-Object Name, FullName | Format-Table
          exit 1
        }
        
        Write-Host "Pacote de deploy encontrado em: $DEPLOY_SOURCE"
        Write-Host "Arquivos no pacote API:"
        Get-ChildItem -Path $DEPLOY_API_SOURCE -File | Select-Object Name | Format-Table
        
        # Criar diretorios se nao existirem
        Write-Host "Criando diretorios de destino..."
        $DEPLOY_API_PATH = Join-Path $DEPLOY_PATH "api"
        $DEPLOY_LOGS_PATH = Join-Path $DEPLOY_API_PATH "Logs"
        $DEPLOY_BACKUPS_PATH = Join-Path $DEPLOY_PATH "backups"
        
        Write-Host "Diretorios de destino:"
        Write-Host "   API: $DEPLOY_API_PATH"
        Write-Host "   Logs: $DEPLOY_LOGS_PATH"
        Write-Host "   Backups: $DEPLOY_BACKUPS_PATH"
        
        # Criar diretorios com verificacao
        if (-not (Test-Path $DEPLOY_PATH)) {
          Write-Host "Criando diretorio base: $DEPLOY_PATH"
          New-Item -ItemType Directory -Path $DEPLOY_PATH -Force | Out-Null
        }
        
        if (-not (Test-Path $DEPLOY_API_PATH)) {
          Write-Host "Criando diretorio API: $DEPLOY_API_PATH"
          New-Item -ItemType Directory -Path $DEPLOY_API_PATH -Force | Out-Null
        }
        
        if (-not (Test-Path $DEPLOY_LOGS_PATH)) {
          Write-Host "Criando diretorio Logs: $DEPLOY_LOGS_PATH"
          New-Item -ItemType Directory -Path $DEPLOY_LOGS_PATH -Force | Out-Null
        }
        
        if (-not (Test-Path $DEPLOY_BACKUPS_PATH)) {
          Write-Host "Criando diretorio Backups: $DEPLOY_BACKUPS_PATH"
          New-Item -ItemType Directory -Path $DEPLOY_BACKUPS_PATH -Force | Out-Null
        }
        
        Write-Host "Diretorios criados/verificados"
        
        # Verificar se os diretorios foram criados
        if (-not (Test-Path $DEPLOY_API_PATH)) {
          Write-Error "Falha ao criar diretorio API: $DEPLOY_API_PATH"
          exit 1
        }
        
        # Backup do appsettings.json se existir
        $APP_SETTINGS_PATH = Join-Path $DEPLOY_API_PATH "appsettings.json"
        Write-Host "Verificando appsettings.json em: $APP_SETTINGS_PATH"
        if (Test-Path $APP_SETTINGS_PATH) {
          $backupName = "appsettings-$(Get-Date -Format 'yyyyMMdd-HHmmss').json"
          $backupPath = Join-Path $DEPLOY_BACKUPS_PATH $backupName
          Write-Host "Fazendo backup do appsettings.json: $backupName"
          Write-Host "   Origem: $APP_SETTINGS_PATH"
          Write-Host "   Destino: $backupPath"
          
          # Verificar se diretorio de backup existe
          if (-not (Test-Path $DEPLOY_BACKUPS_PATH)) {
            Write-Host "Diretorio de backup nao existe, criando: $DEPLOY_BACKUPS_PATH"
            New-Item -ItemType Directory -Path $DEPLOY_BACKUPS_PATH -Force | Out-Null
          }
          
          Copy-Item -Path $APP_SETTINGS_PATH -Destination $backupPath -Force
          
          if (Test-Path $backupPath) {
            $backupInfo = Get-Item $backupPath
            Write-Host "Backup criado com sucesso em: $backupPath"
            Write-Host "   Tamanho: $([math]::Round($backupInfo.Length / 1KB, 2)) KB"
          } else {
            Write-Warning "Backup nao foi criado! Verifique permissoes."
          }
        } else {
          Write-Host "appsettings.json nao encontrado em: $APP_SETTINGS_PATH (primeiro deploy?)"
        }
        
        # Parar servico Windows se existir.
        #
        # MIGRACAO NSSM -> NATIVO: este servidor de producao foi originalmente instalado com o
        # NSSM (C:\Users\Administrator\Downloads\nssm-2.24\nssm-2.24), antes deste workflow saber
        # criar servico Windows nativo (Program.cs ja usa builder.Host.UseWindowsService() ha
        # tempo). O ci-dev.yml ja detecta e migra isso a cada deploy de dev (step "Parar servico
        # (e remover NSSM legado, se houver)") - aqui portamos a MESMA logica: se o ImagePath do
        # servico registrado contiver "nssm", removemos o registro do servico (sc.exe delete) para
        # que o bloco de (re)criacao mais abaixo o recrie como servico Windows nativo. Servico ja
        # nativo (ImagePath aponta direto para LayoutParserApi.exe) segue sem alteracao - so para,
        # binarios sao trocados, reinicia.
        $serviceName = "LayoutParserApi"
        $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if ($svc) {
          $imagePath = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" -ErrorAction SilentlyContinue).ImagePath
          Write-Host "Servico existente (Status=$($svc.Status)). ImagePath: $imagePath"

          Write-Host "Parando servico $serviceName..."
          Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "Servico parado"

          if ($imagePath -match 'nssm') {
            Write-Host "MIGRACAO NSSM -> NATIVO: servico legado gerenciado pelo NSSM detectado."

            # sc.exe delete apaga a chave de registro inteira do servico, inclusive o valor
            # Environment que o step "Configurar ambiente do servico (upsert, nao destrutivo)"
            # acabou de escrever (roda ANTES deste, na mesma chave HKLM do servico NSSM ainda
            # registrado). Sem capturar aqui, o servico nativo recriado abaixo subiria sem
            # Database__Password/IdentityDatabase__*/etc. Guardamos para restaurar apos a criacao.
            $preMigrationEnvironment = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" -Name 'Environment' -ErrorAction SilentlyContinue).Environment

            Write-Host "Removendo o registro do servico para recria-lo como servico Windows nativo..."
            sc.exe delete $serviceName | Out-Null
            for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 2
              if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) { break }
            }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              Write-Error "Servico ainda presente apos delete (marcado para exclusao?). Feche services.msc/handles e re-execute o workflow."
              exit 1
            }
            Write-Host "Servico NSSM removido - sera recriado como nativo apos a copia dos binarios."
          }
        } else {
          Write-Host "Servico $serviceName nao encontrado (pode nao estar instalado como servico) - sera criado como nativo apos a copia dos binarios."
        }
        
        # Copiar arquivos da API (manter appsettings.json se ja existir)
        Write-Host "Copiando arquivos da API..."
        Write-Host "   Origem: $DEPLOY_API_SOURCE"
        Write-Host "   Destino: $DEPLOY_API_PATH"
        
        # Verificar e mostrar caminhos absolutos
        Write-Host "Verificando caminhos..."
        Write-Host "   DEPLOY_PATH (raw): $DEPLOY_PATH"
        Write-Host "   DEPLOY_API_PATH (resolvido): $DEPLOY_API_PATH"
        Write-Host "   DEPLOY_API_PATH existe: $(Test-Path $DEPLOY_API_PATH)"
        
        if (-not (Test-Path $DEPLOY_API_SOURCE)) {
          Write-Error "Diretorio de origem nao encontrado: $DEPLOY_API_SOURCE"
          Write-Host "Conteudo do diretorio de trabalho:"
          Get-ChildItem -Path $WORK_DIR | Select-Object Name | Format-Table
          exit 1
        }
        
        if (-not (Test-Path $DEPLOY_API_PATH)) {
          Write-Error "Diretorio de destino nao encontrado: $DEPLOY_API_PATH"
          Write-Host "Tentando criar novamente..."
          New-Item -ItemType Directory -Path $DEPLOY_API_PATH -Force | Out-Null
          if (-not (Test-Path $DEPLOY_API_PATH)) {
            Write-Error "Falha ao criar diretorio de destino. Verifique permissoes."
            Write-Host "Execute como Administrador:"
            Write-Host "   icacls `"$DEPLOY_PATH`" /grant `"BRNDDAPPBLD01\appbld:(OI)(CI)F`" /T"
            exit 1
          }
        }
        
        # O appsettings.json do destino e preservado por padrao - e a causa do config drift descrito
        # no step "Config drift repo x destino". Depois que a migracao roda (MIGRATE_CONFIG_TO_REPO=true),
        # o que era local ja foi movido para appsettings.Production.json e o arquivo base passa a vir
        # do repo, versionado. O backup do appsettings.json antigo acontece acima, nos dois casos.
        if ($env:CONFIG_MIGRATED -eq 'true') {
          Write-Host "Config migrada: appsettings.json do REPO sera copiado (local preservado em appsettings.Production.json)."
          $apiFiles = Get-ChildItem -Path $DEPLOY_API_SOURCE -Recurse -File
        } else {
          $apiFiles = Get-ChildItem -Path $DEPLOY_API_SOURCE -Exclude "appsettings.json" -Recurse -File
        }
        Write-Host "Encontrados $($apiFiles.Count) arquivos para copiar"
        
        if ($apiFiles.Count -eq 0) {
          Write-Warning "Nenhum arquivo encontrado em: $DEPLOY_API_SOURCE"
          Write-Host "Conteudo do diretorio de origem:"
          Get-ChildItem -Path $DEPLOY_API_SOURCE -Recurse | Select-Object FullName | Format-Table
        }

        # -- Clean deploy: remove do destino o que NAO faz parte do publish atual --------------
        #
        # POR QUE ESTE BLOCO EXISTE: ate aqui o deploy so SOBRESCREVIA arquivos - um arquivo que
        # saiu do repo (renomeado, movido, ou uma DLL de dependencia removida) continuava para
        # sempre no `<deploy>\api` do servidor, de release em release. Decisao do dono
        # (2026-09-07, ver docs/architecture/clean-deploy-estrategia-2026-09-07.md): o destino deve
        # corresponder exatamente ao que o `dotnet publish` deste commit produz - reprodutivel,
        # sem acumulo.
        #
        # O QUE E PRESERVADO DE PROPOSITO (nao e "limpo"): a pasta Logs/logs inteira (historico de
        # log sobrevive a um redeploy - Logging:File:Directory aponta para
        # `<deploy>\api\logs`, DENTRO desta pasta) e appsettings.json/appsettings.Production.json
        # (canal de config local/migrado, ja tratado acima pela flag CONFIG_MIGRATED - aqui so
        # garante que uma limpeza generica nao os apague por engano). Nao mexe em nada fora de
        # `<deploy>\api` (backups/, MLData/, Exemplo/, xsd/, tcl/, xsl/, sysmiddle/, globalfolder/
        # etc. sao pastas IRMAS de `api/`, fora do escopo deste bloco - ver o doc para o
        # levantamento completo dos diretorios de runtime).
        #
        # NAO e um `rm -rf` seguido de copia: e um diff entre o que existe no destino e o que o
        # publish atual contem, removendo so os arquivos ORFAOS (existem no destino, nao existem
        # no publish nem estao na allowlist acima). Erro ao remover um arquivo individual e
        # best-effort (nao aborta o deploy) - o objetivo e reduzir acumulo, nao e tao critico
        # quanto a copia em si.
        if (Test-Path $DEPLOY_API_PATH) {
          # 'logs' = historico de log (Logging:File:Directory aponta para dentro);
          # 'lowcode-runner' = runner low-code publicado por um step anterior (issue #373),
          # fora do publish da API - clean-deploy nao pode trata-lo como orfao.
          $preservarPastasTopo = @('logs', 'lowcode-runner')  # comparado case-insensitive
          $preservarArquivos = @('appsettings.json', 'appsettings.production.json')

          $novosRelativos = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          foreach ($file in $apiFiles) {
            [void]$novosRelativos.Add($file.FullName.Substring($DEPLOY_API_SOURCE.Length + 1))
          }
          # LayoutParserDecrypt.exe/.config e LayoutParserLib.dll sao copiados por um passo
          # separado logo abaixo (fora de $apiFiles) - registrados aqui tambem para nao virarem
          # "orfaos" na mesma passada em que acabaram de ser publicados.
          foreach ($extra in @('LayoutParserDecrypt.exe', 'LayoutParserDecrypt.exe.config', 'LayoutParserLib.dll')) {
            [void]$novosRelativos.Add($extra)
          }

          $removidos = 0
          $existentes = Get-ChildItem -Path $DEPLOY_API_PATH -Recurse -File -ErrorAction SilentlyContinue
          foreach ($existente in $existentes) {
            $relExistente = $existente.FullName.Substring($DEPLOY_API_PATH.Length + 1)
            $primeiraPasta = ($relExistente -split '[\\/]')[0]
            if ($preservarPastasTopo -contains $primeiraPasta.ToLowerInvariant()) { continue }
            if ($preservarArquivos -contains $relExistente.ToLowerInvariant()) { continue }
            if ($relExistente -like 'appsettings.*.local.json' -or $relExistente -eq 'appsettings.Local.json') { continue }
            if ($novosRelativos.Contains($relExistente)) { continue }

            try {
              Remove-Item -Path $existente.FullName -Force -ErrorAction Stop
              $removidos++
            } catch {
              Write-Warning "Clean deploy: falha ao remover orfao $relExistente (best-effort, seguindo): $($_.Exception.Message)"
            }
          }

          if ($removidos -gt 0) {
            Write-Host "Clean deploy: $removidos arquivo(s) orfao(s) removido(s) de $DEPLOY_API_PATH (fora do publish atual e fora da allowlist Logs/appsettings)."
          } else {
            Write-Host "Clean deploy: nenhum arquivo orfao encontrado em $DEPLOY_API_PATH."
          }

          # Diretorios vazios remanescentes (exceto os preservados) - cosmetico, best-effort.
          Get-ChildItem -Path $DEPLOY_API_PATH -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              $preservarPastasTopo -notcontains $_.Name.ToLowerInvariant() -and
              (Get-ChildItem -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue).Count -eq 0
            } |
            Sort-Object { $_.FullName.Length } -Descending |
            ForEach-Object { Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue }
        }
        
        $copiedCount = 0
        $errorCount = 0
        foreach ($file in $apiFiles) {
          try {
            $relativePath = $file.FullName.Substring($DEPLOY_API_SOURCE.Length + 1)
            $destPath = Join-Path $DEPLOY_API_PATH $relativePath
            $destDir = Split-Path $destPath -Parent
            
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            
            Copy-Item -Path $file.FullName -Destination $destPath -Force -ErrorAction Stop
            $copiedCount++
            
            if ($copiedCount % 10 -eq 0) {
              Write-Host "   Copiados $copiedCount / $($apiFiles.Count) arquivos..."
            }
          } catch {
            $errorCount++
            Write-Warning "Erro ao copiar $($file.Name): $($_.Exception.Message)"
          }
        }
        
        Write-Host "Arquivos da API copiados ($copiedCount arquivos, $errorCount erros)"

        # [ATENCAO] Copia parcial NAO e sucesso. Um arquivo travado, disco cheio ou permissao deixa
        # a instalacao viva Frankenstein: parte binario novo, parte antigo, assemblies possivelmente
        # incompativeis - e ate aqui isso era so um Write-Warning e o deploy seguia "com sucesso".
        # Nao ha swap atomico nem backup dos binarios anteriores; um deploy pela metade e pior que
        # nenhum. Entao qualquer erro de copia FALHA o step.
        if ($errorCount -gt 0) {
          Write-Error "Deploy abortado: $errorCount arquivo(s) falharam na copia - instalacao ficaria parcial. Corrija a causa (arquivo em uso, permissao, espaco) e rode de novo."
          exit 1
        }

        # Verificar se os arquivos foram copiados
        Write-Host "Verificando arquivos no destino: $DEPLOY_API_PATH"
        if (Test-Path $DEPLOY_API_PATH) {
          $copiedFiles = Get-ChildItem -Path $DEPLOY_API_PATH -File -ErrorAction SilentlyContinue
          Write-Host "Arquivos no destino: $($copiedFiles.Count) arquivos"
          if ($copiedFiles.Count -gt 0) {
            Write-Host "   Primeiros arquivos:"
            $copiedFiles | Select-Object -First 10 Name, Length, LastWriteTime | Format-Table
          } else {
            Write-Warning "Nenhum arquivo foi copiado para $DEPLOY_API_PATH"
            Write-Host "Listando conteudo do diretorio:"
            Get-ChildItem -Path $DEPLOY_API_PATH -ErrorAction SilentlyContinue | Select-Object Name, FullName | Format-Table
          }
        } else {
          Write-Error "Diretorio de destino nao existe apos tentativa de copia: $DEPLOY_API_PATH"
        }
        
        # Verificar se LayoutParserDecrypt.exe foi copiado
        $decryptExePath = Join-Path $DEPLOY_API_PATH "LayoutParserDecrypt.exe"
        if (Test-Path $decryptExePath) {
          Write-Host "LayoutParserDecrypt.exe encontrado em: $decryptExePath"
        } else {
          Write-Warning "LayoutParserDecrypt.exe nao encontrado em: $decryptExePath"
        }
        
        # Verificar se LayoutParserLib.dll foi copiado
        $libDllPath = Join-Path $DEPLOY_API_PATH "LayoutParserLib.dll"
        if (Test-Path $libDllPath) {
          Write-Host "LayoutParserLib.dll encontrado em: $libDllPath"
        } else {
          Write-Warning "LayoutParserLib.dll nao encontrado em: $libDllPath"
        }
        
        # Verificar se LayoutParserApi.dll foi copiado (Release)
        $apiDllPath = Join-Path $DEPLOY_API_PATH "LayoutParserApi.dll"
        if (Test-Path $apiDllPath) {
          $dllInfo = Get-Item $apiDllPath
          Write-Host "LayoutParserApi.dll encontrado em: $apiDllPath"
          Write-Host "   Data de modificacao: $($dllInfo.LastWriteTime)"
          Write-Host "   Tamanho: $([math]::Round($dllInfo.Length / 1KB, 2)) KB"
        } else {
          Write-Warning "LayoutParserApi.dll nao encontrado em: $apiDllPath"
        }
        
        # (Re)criar servico Windows NATIVO se necessario, entao (re)iniciar.
        #
        # Cobre dois casos: (1) migracao NSSM -> nativo (servico removido no bloco acima) e
        # (2) primeiro deploy neste host (servico nunca existiu). Mesma abordagem do
        # ci-dev.yml (step "Criar/configurar servico Windows nativo"): sc.exe create com o
        # binPath apontando para o .exe recem-copiado, descricao e auto-restart em falha.
        if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
          $exePath = Join-Path $DEPLOY_API_PATH "LayoutParserApi.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executavel nao encontrado: $exePath - nao e possivel criar o servico Windows nativo."
            exit 1
          }

          Write-Host "Criando servico Windows NATIVO $serviceName..."
          # Aspas embutidas via variavel (idiom de PowerShell) para o ImagePath ficar citado no registro.
          $binPath = '"{0}"' -f $exePath
          sc.exe create $serviceName binPath= $binPath start= auto
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao criar o servico (sc create retornou $LASTEXITCODE)"
            exit 1
          }
          sc.exe description $serviceName "LayoutParser API (ASP.NET Core) - servico Windows nativo, deploy via CI producao" | Out-Null
          # Auto-restart em falha: ate 3 restarts com 60s de intervalo; contador zera em 24h.
          sc.exe failure $serviceName reset= 86400 actions= restart/60000/restart/60000/restart/60000 | Out-Null
          Write-Host "Servico criado (start=auto, failure actions configuradas)."

          if ($preMigrationEnvironment) {
            # Migracao NSSM -> nativo: restaura o Environment capturado antes do sc.exe delete
            # (ver comentario no bloco de parada acima) para nao perder Database__Password/
            # IdentityDatabase__*/AiMetrics__IngestApiKey na primeira subida do servico novo.
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" -Name "Environment" -Value ([string[]]$preMigrationEnvironment) -Type MultiString
            Write-Host "Environment restaurado apos migracao NSSM -> nativo ($($preMigrationEnvironment.Count) variavel(is))."
          } else {
            Write-Warning "Servico recem-criado sem Environment previo (primeiro deploy neste host?). O step 'Configurar ambiente do servico (upsert, nao destrutivo)' roda ANTES deste no pipeline e sai sem escrever nada se o servico ainda nao estava registrado - rode o workflow de novo apos esta criacao para que esse step aplique Database__Password/IdentityDatabase__*/etc., ou configure manualmente antes do proximo deploy."
          }
        }

        # Reiniciar servico Windows
        if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
          Write-Host "Reiniciando servico $serviceName..."
          Start-Service -Name $serviceName -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $service = Get-Service -Name $serviceName
          if ($service.Status -eq 'Running') {
            Write-Host "Servico $serviceName esta em execucao"
          } else {
            Write-Warning "Servico $serviceName nao esta em execucao (Status: $($service.Status))"
          }
        } else {
          Write-Host "Servico $serviceName nao encontrado. Execute manualmente:"
          Write-Host "   cd $DEPLOY_API_PATH"
          Write-Host "   dotnet LayoutParserApi.dll"
        }
        
        # Validar deploy
        Write-Host "`nDeploy da API concluido com sucesso!"
        Write-Host "API: $DEPLOY_API_PATH"
        Write-Host "Logs: $DEPLOY_LOGS_PATH"
        Write-Host "Backups: $DEPLOY_BACKUPS_PATH"
        Write-Host "Runner: Self-hosted (execucao local)"

    # -- Smoke test de READINESS pos-deploy (FATAL) ----------------------------------
    #
    # POR QUE ESTE STEP EXISTE: o step de deploy acima termina com Start-Service + checagem de
    # Status -eq 'Running'. Processo DE PE nao e igual a API que SERVE: o servico pode estar
    # Running e a API estar Unhealthy (SQL fora, catalogo que nao aqueceu, decryptor quebrado).
    # Ate aqui producao aceitava como "sucesso" uma versao que sobe e nao funciona.
    #
    # Este step fecha essa lacuna espelhando a logica que o ci-dev.yml ja usa: bate em
    # /health/ready exigindo HTTP 200 ESTRITO, com retry/backoff para dar tempo ao warm-up do
    # catalogo (a sonda roda SELECT 1 no SQL e confere o catalogo; enquanto aquece responde 503).
    # 503 nao e sucesso nem falha definitiva - e "ainda nao pronto", entao o laco RETENTA. So 200
    # encerra com sucesso; esgotar as tentativas FALHA o deploy (exit 1).
    #
    # /health/ready e ANONIMO (mapeado por MapHealthChecks, FORA do pipeline de filtros MVC).
    # O ApiKeyGateFilter foi REMOVIDO do codigo (2026-08-12, `feat/identidade-do-bff`) - a
    # defesa BFF->API passou a ser rede (bind em loopback), nao chave compartilhada.
    - name: Smoke test de readiness (pos-deploy)
      id: smoke_test
      env:
        API_URL_PROD: ${{ vars.API_URL_PROD }}
      run: |
        $ErrorActionPreference = "Stop"

        # URL de producao: nao ha var canonica de URL neste workflow (o deploy usa so DEPLOY_PATH).
        # A instancia de producao serve na porta 5000 (o appsettings fixa 5000; o front consome :5000).
        # Se a Variable API_URL_PROD existir, ela tem precedencia; senao, derivamos localhost:5000 -
        # o runner roda NO proprio servidor, entao localhost e a instancia recem-publicada.
        $API_URL = "$env:API_URL_PROD".Trim('"', "'", ' ', '/')
        if ([string]::IsNullOrWhiteSpace($API_URL)) {
          $API_URL = "http://localhost:5000"
          Write-Warning ("Variable API_URL_PROD nao configurada - usando o default $API_URL. " +
            "Para apontar a validacao para outro host/porta, crie a Variable API_URL_PROD em: " +
            "GitHub -> repo LayoutParserApi -> Settings -> Secrets and variables -> Actions -> aba Variables.")
        }
        $smokeUrl = "$API_URL/health/ready"

        # /health/ready e anonimo - sem header de autenticacao a montar.
        $smokeHeaders = @{}

        Write-Host "Smoke test de readiness: $smokeUrl (exige HTTP 200 estrito)"

        # Mesma cadencia do ci-dev: ate 24 tentativas x 5s = ~2min de folga para o warm-up.
        $status = $null
        $tentativas = 24
        $corpo = $null
        for ($i = 1; $i -le $tentativas; $i++) {
          $corpo = $null
          try {
            # TimeoutSec=10 (era 5): o pior caso do proprio SqlServerHealthCheck (Connection
            # Timeout=3 + Command Timeout=3, ate ~6s) e maior que os 5s antigos, o que confundia
            # "SQL um pouco lento" com "sem resposta". 10s da margem sem alargar a janela total
            # de tentativas (investigacao docs/architecture/investigacao-instabilidade-sql-deploy-2026-09-05.md).
            $resp = Invoke-WebRequest -Uri $smokeUrl -UseBasicParsing -TimeoutSec 10 -Headers $smokeHeaders
            $status = [int]$resp.StatusCode
            $corpo = $resp.Content
          } catch {
            $r = $_.Exception.Response
            $status = if ($r -and $r.StatusCode) { [int]$r.StatusCode } else { $null }
            if ($r) {
              try {
                # GetResponseStream() pode vir vazio/fechado (WebException ja consumido pelo
                # Invoke-WebRequest), o que fazia o corpo do 503 nunca aparecer no log (achado #4
                # da investigacao 2026-09-05). $_.ErrorDetails.Message preserva o corpo em erro
                # de forma confiavel no PowerShell 7 (pwsh, ja e o shell usado aqui) - tenta
                # primeiro, cai no stream como fallback.
                if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
                  $corpo = $_.ErrorDetails.Message
                } else {
                  $stream = $r.GetResponseStream()
                  $reader = New-Object System.IO.StreamReader($stream)
                  $corpo = $reader.ReadToEnd()
                }
              } catch { }
            }
          }

          if ($status -eq 200) {
            Write-Host "Smoke test: HTTP 200 em $smokeUrl (readiness OK, tentativa $i/$tentativas)."
            break
          }

          $descr = if ($null -eq $status) { "sem resposta" } else { "HTTP $status" }
          # Corpo do /health/ready mostra QUAL dependencia esta Unhealthy (sql/redis/decryptor/
          # lowcode-runner/catalog) - sem isso so se descobre a causa lendo o log do host depois.
          if ($corpo) { Write-Host "    corpo: $corpo" }
          if ($i -lt $tentativas) {
            Write-Host "  tentativa $i/$($tentativas): readiness ainda nao pronta ($descr), aguardando 5s..."
            Start-Sleep -Seconds 5
          }
        }

        if ($status -ne 200) {
          $ultimo = if ($null -eq $status) { "sem resposta" } else { "HTTP $status" }
          # FIX (2026-09-07): era Write-Error. Com $ErrorActionPreference="Stop" (topo do
          # step), Write-Error e SEMPRE terminante - o script abortava exatamente aqui, ANTES
          # do bloco de rollback abaixo rodar. Ou seja, o rollback automatico prometido pelo
          # incidente de 2026-08-15/PR #114 nunca chegava a executar; producao ficava presa na
          # versao quebrada com o service Windows "Running" mas sem responder. Descoberto ao
          # vivo no deploy que ativou MIGRATE_CONFIG_TO_REPO (issue #112) - Write-Host nao-
          # terminante deixa o fluxo continuar ate o rollback de verdade, abaixo.
          Write-Host ("ATENCAO: Readiness nao ficou 200 em $smokeUrl apos $tentativas tentativas (ultimo: $ultimo). " +
            "A versao nova falhou o smoke test - iniciando rollback automatico para nao deixar producao no ar " +
            "quebrada (incidente de 2026-08-15, PR #114, motivou este mecanismo).")

          # -- Rollback automatico -------------------------------------------------------
          #
          # Restaura o binario capturado pelo step "Backup pre-deploy do binario atual (para
          # rollback)", mais acima no MESMO job. So confirma readiness UMA VEZ apos o rollback
          # (sem retry longo) - o objetivo aqui e so tirar a producao do estado quebrado, nao
          # revalidar a fundo. O `exit 1` acontece de qualquer forma logo abaixo: a versao nova
          # falhou e isso continua sendo sempre uma falha de deploy que precisa ser investigada.
          $rollbackOk = $false
          $rollbackMsg = ""
          try {
            $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')
            $DEPLOY_API_PATH = Join-Path $DEPLOY_PATH "api"
            $BACKUPS_ROOT = Join-Path $DEPLOY_PATH "backups"

            $backupPath = "$env:PRE_DEPLOY_BACKUP_PATH"
            if ([string]::IsNullOrWhiteSpace($backupPath) -or -not (Test-Path $backupPath)) {
              # Fallback: acha a geracao pre-deploy mais recente pelo nome do diretorio (o timestamp
              # no nome ordena cronologicamente). Cobre o caso do env var nao ter propagado.
              $maisRecente = Get-ChildItem -Path $BACKUPS_ROOT -Directory -Filter 'pre-deploy-*' -ErrorAction SilentlyContinue |
                             Sort-Object Name -Descending | Select-Object -First 1
              if ($maisRecente) { $backupPath = Join-Path $maisRecente.FullName 'api' }
            }

            if ([string]::IsNullOrWhiteSpace($backupPath) -or -not (Test-Path $backupPath)) {
              $rollbackMsg = ("ROLLBACK NAO EXECUTADO - nenhum backup pre-deploy encontrado em $BACKUPS_ROOT " +
                "(primeiro deploy?). Producao permanece na versao que falhou o smoke test - intervencao " +
                "manual necessaria AGORA no host de producao.")
              # Write-Host, nao Write-Error (mesmo motivo do fix acima: precisa chegar no resumo/e-mail abaixo).
              Write-Host $rollbackMsg
            } else {
              Write-Host "Restaurando backup: $backupPath -> $DEPLOY_API_PATH"
              $serviceName = "LayoutParserApi"

              if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
                Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 3
              }

              Get-ChildItem -Path $DEPLOY_API_PATH -Recurse -File -ErrorAction SilentlyContinue |
                Remove-Item -Force -ErrorAction SilentlyContinue
              Copy-Item -Path (Join-Path $backupPath '*') -Destination $DEPLOY_API_PATH -Recurse -Force

              if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
                Start-Service -Name $serviceName -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 3
              }

              # Checagem UNICA pos-rollback (sem retry/backoff) - so confirma que o rollback trouxe
              # o servico de volta, nao revalida o warm-up completo.
              $statusRollback = $null
              try {
                # TimeoutSec=10 (era 5) - mesma margem aplicada ao smoke test principal acima,
                # coerente com o pior caso do SqlServerHealthCheck (~6s).
                $respRollback = Invoke-WebRequest -Uri $smokeUrl -UseBasicParsing -TimeoutSec 10
                $statusRollback = [int]$respRollback.StatusCode
              } catch {
                $r = $_.Exception.Response
                $statusRollback = if ($r -and $r.StatusCode) { [int]$r.StatusCode } else { $null }
              }

              if ($statusRollback -eq 200) {
                $rollbackOk = $true
                $rollbackMsg = "ROLLBACK EXECUTADO - versao anterior restaurada de $backupPath, servico voltou a responder (readiness 200)."
                Write-Host $rollbackMsg
              } else {
                $descrRollback = if ($null -eq $statusRollback) { "sem resposta" } else { "HTTP $statusRollback" }
                $rollbackMsg = ("ROLLBACK EXECUTADO mas o servico NAO respondeu 200 apos restaurar ($descrRollback) - " +
                  "situacao MAIS GRAVE que uma falha comum de deploy, requer intervencao manual IMEDIATA no host de producao.")
                Write-Host $rollbackMsg
              }
            }
          } catch {
            $rollbackMsg = ("ROLLBACK FALHOU com excecao: $($_.Exception.Message) - producao pode estar em estado " +
              "inconsistente, intervencao manual IMEDIATA necessaria no host de producao.")
            Write-Host $rollbackMsg
          }

          # Resumo minimo viavel (sem webhook/integracao nova): o proprio GITHUB_STEP_SUMMARY,
          # visivel direto na pagina do run. Montado linha a linha (sem here-string) para nao
          # depender de indentacao literal dentro do bloco YAML `run: |`.
          $resumoStatus = if ($rollbackOk) { "ROLLBACK OK" } else { "ATENCAO - ROLLBACK FALHOU OU NAO FOI POSSIVEL" }
          if ($env:GITHUB_STEP_SUMMARY) {
            $resumoLinhas = New-Object System.Collections.Generic.List[string]
            $resumoLinhas.Add("## Deploy de producao FALHOU - smoke test de readiness")
            $resumoLinhas.Add("")
            $resumoLinhas.Add("- Versao nova nao ficou HTTP 200 em ``$smokeUrl`` apos $tentativas tentativas (ultimo: $ultimo).")
            $resumoLinhas.Add("- **$resumoStatus**")
            $resumoLinhas.Add("- $rollbackMsg")
            $resumoLinhas.Add("")
            $resumoLinhas.Add("Investigue a causa raiz antes de tentar um novo deploy.")
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $resumoLinhas
          }

          # -- Outputs para o step de notificacao por e-mail (abaixo) ---------------------
          #
          # Precisam ser escritos ANTES do exit 1: Add-Content em $env:GITHUB_OUTPUT persiste
          # mesmo que o step termine com falha logo em seguida - e o unico jeito de repassar
          # o resumo (multilinha) para um step subsequente sem reconstrui-lo do zero.
          if ($env:GITHUB_OUTPUT) {
            $assunto = if ($rollbackOk) { "ROLLBACK OK" } else { "ROLLBACK FALHOU" }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "alert_status=$assunto"
            $delimiter = "EOF_ALERT_BODY_$([guid]::NewGuid().ToString('N'))"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "alert_body<<$delimiter"
            Add-Content -Path $env:GITHUB_OUTPUT -Value ($resumoLinhas -join "`n")
            Add-Content -Path $env:GITHUB_OUTPUT -Value ""
            Add-Content -Path $env:GITHUB_OUTPUT -Value "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "Commit: $env:GITHUB_SHA (ref $env:GITHUB_REF)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
          }

          exit 1
        }
        Write-Host "Deploy de producao validado: API servindo (readiness 200)."

    # -- Alerta ativo por e-mail: smoke test falhou (rollback OK/FALHOU) -------------
    #
    # Item 1 do raio-X de maturidade (docs/architecture/specs-execucao-maturidade-2026-08-16.md).
    # Canal escolhido pelo dono: e-mail (Teams/Slack ficaram de fora - pago). Provedor SMTP
    # ainda NAO foi escolhido pelo dono - este step referencia os secrets esperados e PULA
    # graciosamente (nao falha o workflow) enquanto eles nao existirem. Ver
    # `.claude/rules/security.md` -> secao "Alerta de deploy por e-mail" para o passo a passo
    # de como o dono cria os secrets quando decidir o provedor (ex.: Gmail + senha de app).
    #
    # Dispara so quando o step "Smoke test de readiness" FALHOU (steps.smoke_test.outcome ==
    # 'failure') - cobre os 2 primeiros casos do raio-X: rollback executado com sucesso OU
    # rollback tambem falhou/nao foi possivel (o texto exato vem em steps.smoke_test.outputs.alert_body).
    - name: Notificar falha de deploy por e-mail (smoke test / rollback)
      if: >-
        always() && steps.smoke_test.outcome == 'failure' &&
        steps.smoke_test.outputs.alert_body != '' && env.SMTP_CONFIGURADO == 'true'
      continue-on-error: true
      # Pinado por SHA (tag mutavel proibida p/ Action de terceiro nao-imutavel - CodeQL
      # actions/unpinned-tag). SHA corresponde a tag v3.
      uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
      with:
        # Secrets ainda NAO preenchidos pelo dono (provedor SMTP em aberto). Enquanto
        # secrets.SMTP_SERVER estiver vazio, a Action falha rapido - por isso o step inteiro
        # tem continue-on-error: true acima: nao pode derrubar o workflow so por falta de config.
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "[LayoutParserApi] Deploy de producao FALHOU - ${{ steps.smoke_test.outputs.alert_status }}"
        to: ${{ secrets.ALERT_EMAIL_TO }}
        from: "LayoutParserApi Deploy <${{ secrets.SMTP_USERNAME }}>"
        body: ${{ steps.smoke_test.outputs.alert_body }}

    # -- Smoke test do runner low-code (NAO-FATAL, ruidoso) -------------------------
    #
    # O smoke test de readiness acima so confere que LowCode:RunnerPath aponta para um arquivo
    # existente (LowCodeRunnerHealthCheck e Degraded->200 quando falta) - NAO prova que o `.exe`
    # SOBE. A parte sensivel e SysMiddle.Base.InstanceFactory.Initialize() (carga de log4net e do
    # gate de licenca), que so roda quando o runner chega em CriarExecutor.
    #
    # Este step exercita exatamente isso: roda o runner em modo LIST posicional
    # (<globalFolder> <package> LIST <in> <out>). LIST sobe o SDK e enumera os mapeadores do
    # package, sem precisar de documento de entrada nem dos 48-137s de uma transformacao real.
    # Exit 0 = runner apto no host. Qualquer outra coisa = pathway low-code quebrado.
    #
    # POR QUE NAO-FATAL (por ora): tornar isto fatal acopla TODO deploy futuro da API - inclusive
    # correcoes que nao tocam low-code - a um runtime de TERCEIROS (SDK Sysmiddle + gate de
    # licenca + catalogo globalfolder no host) que nunca foi provado rodar a partir de Functions/
    # no .42. O caminho seguro e deixar ruidoso agora e, depois de um deploy confirmar que sobe,
    # promover a fatal (trocar o `exit 0` final por `exit 1` e remover continue-on-error).
    # Recomendacao registrada para o dono decidir.
    - name: Smoke test do runner low-code (nao-fatal)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $runner = "$env:LOWCODE_RUNNER_PATH_RESOLVED"
        if ([string]::IsNullOrWhiteSpace($runner) -or -not (Test-Path $runner)) {
          Write-Warning "Runner low-code nao foi publicado neste deploy (LOWCODE_RUNNER_PATH_RESOLVED vazio) - nada a testar."
          exit 0
        }

        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')
        $globalFolder = Join-Path $DEPLOY_PATH 'globalfolder'
        if (-not (Test-Path $globalFolder)) {
          Write-Warning "globalfolder nao encontrado em $globalFolder - LIST do runner nao pode rodar. Pathway low-code NAO validado neste deploy."
          exit 0
        }

        # Package: mesmo valor gerenciado pelo step de Environment (identificador do projeto
        # Sysmiddle, nao e segredo).
        $package = '938f9978-836f-48c1-9c0f-c2898caf4b20'
        $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
        $dummy = Join-Path $tmp 'lowcode-smoke-unused.txt'

        Write-Host "Rodando runner em modo LIST: $runner"
        $saida = & $runner $globalFolder $package 'LIST' $dummy $dummy 2>&1
        $code = $LASTEXITCODE
        $saida | ForEach-Object { Write-Host "    $_" }
        Write-Host "Runner LIST exit=$code"

        if ($code -eq 0) {
          Write-Host "Runner low-code SOBE no host (LIST enumerou o package sem erro de init)."
          exit 0
        }

        $msg = "ATENCAO: runner low-code NAO subiu (LIST exit=$code). O endpoint execute-lowcode segue " +
          "retornando 500 em producao mesmo com o .exe publicado - provavel falha em " +
          "InstanceFactory.Initialize() (assembly/licenca) ou globalfolder/package invalido. " +
          "Deploy NAO foi abortado (step nao-fatal, ver cabecalho)."
        Write-Host $msg
        if ($env:GITHUB_STEP_SUMMARY) {
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Runner low-code: smoke test FALHOU (nao-fatal)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- LIST exit=$code em ``$runner``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- O endpoint execute-lowcode continuara retornando 500 ate isto ser resolvido."
        }
        exit 0

    # -- Diagnostico de pre-requisitos (NAO-FATAL) -----------------------------------
    #
    # Este step nunca falha o deploy. Ele existe porque duas perguntas so podem ser
    # respondidas DE DENTRO do host de destino, e ninguem tem acesso de filesystem a ele
    # de fora (\\172.25.32.42\c$ inacessivel, SSH/WinRM/SMB negados):
    #
    #   1. Existe instancia FiatMQ instalada aqui? Sem ela nao ha onde publicar o
    #      LayoutParserLowCodeRunner.exe - ele e net481/x86 e resolve dependencias pelo
    #      diretorio do proprio .exe, entao so executa DE DENTRO da AppConnector.DIR\Bin
    #      (a pasta tools/LowCodeRunner/Functions/ do repo NAO consegue hospeda-lo:
    #      divergencia de assembly, log4net 1.2.13.0 vs 2.0.17.0, estoura em
    #      InstanceFactory.Initialize()).
    #   2. Existe Redis no host? A API conecta UMA UNICA VEZ no startup; se falhar, o cache
    #      fica desligado ate o processo reiniciar. Sonda externa a :6379 nao responde, mas a
    #      config e "localhost" - um Redis ligado so a interface local serviria a API e
    #      recusaria a sonda. Inconclusivo de fora, conclusivo aqui.
    #
    # A saida deste step e o insumo para decidir o step de publicacao do runner.
    - name: Diagnostico de pre-requisitos (nao-fatal)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        try {
          $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')

          Write-Host "=== 1) Runner low-code no destino ==="
          # Desde a issue #373 o runner e publicado em <deploy>\api\lowcode-runner\ (copia da pasta
          # Functions/ do repo). O caminho legado <deploy>\api\LayoutParserLowCodeRunner.exe fica
          # so como checagem historica.
          $runnerPath = Join-Path $DEPLOY_PATH 'api\lowcode-runner\LayoutParserLowCodeRunner.exe'
          $runnerLegado = Join-Path $DEPLOY_PATH 'api\LayoutParserLowCodeRunner.exe'
          if (Test-Path $runnerPath) {
            $info = Get-Item $runnerPath
            $l4n = Join-Path (Split-Path $runnerPath) 'log4net.dll'
            $l4nVer = if (Test-Path $l4n) { (Get-Item $l4n).VersionInfo.FileVersion } else { '(ausente)' }
            Write-Host "  PRESENTE: $runnerPath ($([math]::Round($info.Length / 1KB, 2)) KB, $($info.LastWriteTime), log4net $l4nVer)"
          } elseif (Test-Path $runnerLegado) {
            Write-Host "  PRESENTE (caminho legado): $runnerLegado - migrar para lowcode-runner\ no proximo deploy."
          } else {
            Write-Host "  AUSENTE: $runnerPath"
            Write-Host "  -> LowCode:RunnerPath aponta para um arquivo que nao existe; toda transformacao low-code falha."
            Write-Host "  -> Ver o step 'Publicar runner low-code (pasta Functions do repo)' - provavel Functions/ ausente/inapta no checkout."
          }

          Write-Host "=== 2) Bin do Sysmiddle apta a hospedar o runner ==="
          # [ATENCAO] Detecta pela DLL, NAO pelo nome da pasta. A versao anterior deste step procurava
          # literalmente por um diretorio 'AppConnector.DIR' e dava FALSO NEGATIVO: na maquina de dev
          # a instancia se chama C:\appconnector\App\Bin. O nome nao qualifica nada - o que qualifica
          # e ter SysMiddle.Base.dll com o log4net CERTO ao lado.
          #
          # O discriminador e a versao do log4net, e a diferenca e binaria (verificado 2026-08-10 na
          # maquina de dev):
          #   C:\appconnector\App\Bin                     log4net 2.0.17.0  -> APTA (580 arquivos)
          #   <deploy>\api\Functions                      log4net 1.2.13.0  -> INVIAVEL
          # De Functions/ o runner estoura em InstanceFactory.Initialize() por divergencia de
          # assembly. Publicar o .exe na pasta errada produz falha em runtime, nao erro de deploy -
          # por isso a deteccao precisa ser por conteudo, e nao por convencao de nome.
          $candidatas = New-Object System.Collections.Generic.List[string]
          $raizes = Get-ChildItem -Path 'C:\' -Directory -Force -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -notin @('Windows','Users','ProgramData','$Recycle.Bin','System Volume Information','Recovery') }
          foreach ($r in $raizes) {
            Get-ChildItem -Path $r.FullName -File -Recurse -Depth 4 -Filter 'SysMiddle.Base.dll' -ErrorAction SilentlyContinue |
              ForEach-Object { $candidatas.Add($_.DirectoryName) }
          }

          if ($candidatas.Count -eq 0) {
            Write-Host "  NENHUM SysMiddle.Base.dll encontrado (profundidade 4 nas raizes de C:\)."
            Write-Host "  -> Sem Bin do Sysmiddle, publicar o runner aqui NAO o faz executar: ele e"
            Write-Host "     net481/x86 e resolve dependencias pelo diretorio do proprio .exe."
            Write-Host "  -> Decisao do dono do projeto (ver plano de arquitetura, secao 2.1)."
          } else {
            foreach ($d in ($candidatas | Sort-Object -Unique)) {
              $l4n = Join-Path $d 'log4net.dll'
              $ver = if (Test-Path $l4n) { (Get-Item $l4n).VersionInfo.FileVersion } else { '(ausente)' }
              $qtd = (Get-ChildItem -Path $d -File -ErrorAction SilentlyContinue | Measure-Object).Count
              $apta = ($ver -like '2.*')
              Write-Host "  $d"
              Write-Host "     log4net: $ver | arquivos: $qtd | APTA: $apta"
            }
          }

          Write-Host "=== 3) Redis em localhost:6379 ==="
          $tcp = New-Object System.Net.Sockets.TcpClient
          $ok = $false
          try {
            $ok = $tcp.ConnectAsync('127.0.0.1', 6379).Wait(3000) -and $tcp.Connected
          } catch { $ok = $false } finally { $tcp.Dispose() }
          if ($ok) {
            Write-Host "  ACEITANDO CONEXAO - o cache Redis da API tende a subir normalmente."
          } else {
            Write-Host "  NAO respondeu em 3s."
            Write-Host "  -> A API sobe DEGRADADA (sem cache) e so reconecta se o processo reiniciar."
          }
          $svcRedis = Get-Service -Name '*redis*' -ErrorAction SilentlyContinue
          if ($svcRedis) {
            $svcRedis | ForEach-Object { Write-Host "  servico: $($_.Name) = $($_.Status)" }
          } else {
            Write-Host "  Nenhum servico Windows com 'redis' no nome."
          }
        } catch {
          Write-Warning "Diagnostico falhou (nao bloqueia o deploy): $($_.Exception.Message)"
        }
        exit 0

    # -- Alerta ativo por e-mail: fallback generico (DEPLOY ABORTADO) -----------------
    #
    # Cobre o 3o caso do raio-X (menor prioridade): o job falhou ANTES do smoke test rodar
    # (build/publish/backup quebrou, por exemplo) - nesse caso steps.smoke_test nem chegou a
    # existir ou terminou com outcome 'skipped'/'cancelled', entao o step de e-mail acima
    # (que exige outcome == 'failure') nao dispara. Este step e o catch-all: `if: failure()`
    # cobre qualquer falha do job inteiro; a condicao `steps.smoke_test.outcome != 'failure'`
    # evita e-mail DUPLICADO quando quem falhou foi o smoke test (esse caso ja foi notificado
    # acima, com o resumo detalhado do rollback).
    #
    # Mesmos secrets do step anterior (ver `.claude/rules/security.md`). Enquanto
    # secrets.SMTP_SERVER estiver vazio, este step tambem pula sem quebrar o workflow.
    - name: Notificar falha de deploy por e-mail (fallback - deploy abortado antes do smoke test)
      if: >-
        failure() && steps.smoke_test.outcome != 'failure' && env.SMTP_CONFIGURADO == 'true'
      continue-on-error: true
      # Pinado por SHA (tag mutavel proibida p/ Action de terceiro nao-imutavel - CodeQL
      # actions/unpinned-tag). SHA corresponde a tag v3.
      uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "[LayoutParserApi] Deploy de producao ABORTADO antes do smoke test"
        to: ${{ secrets.ALERT_EMAIL_TO }}
        from: "LayoutParserApi Deploy <${{ secrets.SMTP_USERNAME }}>"
        body: |
          O job de deploy de producao falhou ANTES do smoke test de readiness rodar
          (provavel falha de build/publish/backup - ver o run para o step exato que falhou).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }} (ref ${{ github.ref }})

          Investigue a causa raiz antes de tentar um novo deploy.
