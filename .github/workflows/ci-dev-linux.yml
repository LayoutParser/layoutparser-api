name: CI Dev Linux (LayoutParserApi)

# Fase 3 da migracao Linux (issue #578, Epic #575). Pipeline PARALELO ao ci-dev.yml (Windows).
# Somente workflow_dispatch: NAO substitui o pipeline Windows - rollback = nao usar este arquivo.
# Runner: label 'linux' + 'dev-local'. Deploy via systemd + EnvironmentFile (sem registro do Windows).
# Arquivos de apoio: deploy/linux/layoutparser-api.service e deploy/linux/secrets.env.example.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dev-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: [self-hosted, linux, dev-local]
    timeout-minutes: 30
    env:
      # setup-dotnet instala em /usr/share/dotnet por padrao (sem permissao para o usuario do runner): usar o tool cache.
      DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH_DEV_LINUX || '/opt/layoutparser-api' }}
      API_URL: ${{ vars.API_URL_DEV_LINUX || 'http://localhost:5100' }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: layoutparser-api

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Build e testes
      run: |
        dotnet restore layoutparser-api/LayoutParserApi.csproj
        dotnet build layoutparser-api/LayoutParserApi.csproj -c Release --no-restore
        dotnet test layoutparser-api --no-restore -c Release --verbosity minimal

    - name: Publish
      run: dotnet publish layoutparser-api/LayoutParserApi.csproj -c Release -o "$RUNNER_TEMP/publish"

    # Segredos ficam em /etc/layoutparser-api/secrets.env (chmod 600, provisionado uma vez pelo
    # operador a partir de deploy/linux/secrets.env.example) - o workflow NUNCA escreve segredo.
    - name: Deploy (systemd)
      run: |
        set -euo pipefail
        test -f /etc/layoutparser-api/secrets.env || { echo "secrets.env ausente - ver deploy/linux/secrets.env.example"; exit 1; }
        sudo rm -rf "${DEPLOY_PATH}.prev"; [ -d "$DEPLOY_PATH" ] && sudo cp -a "$DEPLOY_PATH" "${DEPLOY_PATH}.prev" || true
        sudo mkdir -p "$DEPLOY_PATH"
        sudo rsync -a --delete --exclude 'appsettings.Production.json' "$RUNNER_TEMP/publish/" "$DEPLOY_PATH/"
        sudo cp layoutparser-api/deploy/linux/layoutparser-api.service /etc/systemd/system/layoutparser-api.service
        sudo systemctl daemon-reload
        sudo systemctl enable layoutparser-api
        sudo systemctl restart layoutparser-api

    - name: Smoke test de readiness
      run: |
        for i in $(seq 1 12); do
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$API_URL/health/ready" || true)
          echo "tentativa $i: HTTP $code"
          [ "$code" = "200" ] && exit 0
          sleep 10
        done
        cat /tmp/ready.json || true
        echo "Smoke falhou - rollback para .prev"
        if [ -d "${DEPLOY_PATH}.prev" ]; then
          sudo rsync -a --delete "${DEPLOY_PATH}.prev/" "$DEPLOY_PATH/"
          sudo systemctl restart layoutparser-api
        fi
        exit 1
