name: Config Drift Report (repo x producao)

# Workflow SOMENTE-LEITURA, extraido de deploy.yml (step "Config drift repo x destino").
# Objetivo: comparar o appsettings.json do repositorio com o appsettings.json ja instalado
# no host de producao, SEM rodar build/test/publish e SEM tocar no servico Windows
# LayoutParserApi (nada de Stop-Service/copia de binarios aqui).
#
# Ver .claude/agent-memory/lp-devops/ para o contexto completo (issues #107/#108, analise de
# @lp-architect). Este workflow existe porque deploy.yml so roda o step de drift no meio de um
# job que ja fez build+quality-gate+publish+Stop-Service+restart - ou seja, disparar deploy.yml
# so pra ler o relatorio significa fazer um deploy de producao de verdade. Este arquivo isola
# a leitura.
#
# NUNCA MIGRA: ao contrario do step original (controlado por vars.MIGRATE_CONFIG_TO_REPO), este
# workflow forca sempre o modo dry-run/relatorio, independente do valor da variable no repo -
# migracao real continua sendo responsabilidade exclusiva de deploy.yml, com todos os guard-rails
# de segredo que ja existem la (ver comentarios em deploy.yml em torno da linha 540).
#
# Disparo: manual apenas (workflow_dispatch). Nao roda em push - isto e uma ferramenta de
# diagnostico sob demanda, nao um gate de CI.
on:
  workflow_dispatch:

# Minimo necessario: so faz checkout deste repo e le o filesystem do runner (DEPLOY_PATH) -
# nenhum step comenta PR, cria release ou escreve outro recurso do GitHub.
permissions:
  contents: read

concurrency:
  group: config-drift-report
  cancel-in-progress: false

jobs:
  report:
    # Mesmo runner/label do deploy real: precisa enxergar o mesmo filesystem (DEPLOY_PATH) do
    # host de producao (172.25.32.42 / WINSRV2022-LIB). Nao publica nada, so le.
    runs-on: [self-hosted, windows, production]
    timeout-minutes: 15

    steps:
    - name: Checkout LayoutParserApi
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: LayoutParserApi

    # -- Config drift: repo x destino (SEMPRE dry-run neste workflow) ----------------
    #
    # Copia fiel da logica do step homonimo em deploy.yml, com uma unica diferenca deliberada:
    # $migrar e sempre $false aqui, nunca le vars.MIGRATE_CONFIG_TO_REPO. Este workflow e
    # puramente de leitura; a migracao real so acontece pelo deploy.yml (onde o guard-rail de
    # segredo tambem vive).
    - name: Config drift repo x destino (somente relatorio)
      run: |
        $ErrorActionPreference = "Continue"
        $DEPLOY_PATH = "${{ secrets.DEPLOY_PATH }}".Trim('"', '''', ' ')
        $destino = Join-Path $DEPLOY_PATH 'api\appsettings.json'
        $repo = Join-Path $PWD.Path 'LayoutParserApi\appsettings.json'

        if (-not (Test-Path $destino)) {
          Write-Host "Sem appsettings.json no destino (primeiro deploy?) - nada a comparar."
          exit 0
        }
        if (-not (Test-Path $repo)) {
          Write-Warning "appsettings.json do repo nao encontrado em $repo - comparacao abortada."
          exit 0
        }

        # Achata o JSON em pares "Secao:Chave = valor" para comparar chave a chave.
        function Flatten($obj, $prefixo, $acc) {
          foreach ($p in $obj.PSObject.Properties) {
            $chave = if ($prefixo) { "$prefixo`:$($p.Name)" } else { $p.Name }
            if ($p.Value -is [PSCustomObject]) { Flatten $p.Value $chave $acc }
            else { $acc[$chave] = ($p.Value | ConvertTo-Json -Compress -Depth 10) }
          }
        }

        $mapaRepo = @{}; $mapaDestino = @{}
        Flatten (Get-Content $repo -Raw | ConvertFrom-Json) '' $mapaRepo
        Flatten (Get-Content $destino -Raw | ConvertFrom-Json) '' $mapaDestino

        # NUNCA ecoar valor de chave sensivel: o destino carrega Database:Password em texto plano.
        function EhSensivel($chave) {
          return ($chave -match '(?i)password|apikey|secret|token|connectionstring')
        }

        $divergentes = New-Object System.Collections.Generic.List[string]
        $soNoDestino = New-Object System.Collections.Generic.List[string]
        foreach ($chave in ($mapaDestino.Keys | Sort-Object)) {
          if (-not $mapaRepo.ContainsKey($chave)) { $soNoDestino.Add($chave); continue }
          if ($mapaDestino[$chave] -ne $mapaRepo[$chave]) { $divergentes.Add($chave) }
        }
        $soNoRepo = @($mapaRepo.Keys | Where-Object { -not $mapaDestino.ContainsKey($_) } | Sort-Object)

        Write-Host "=== Config drift: repo x destino (SOMENTE RELATORIO) ==="
        Write-Host "  Chaves no repo: $($mapaRepo.Count) | no destino: $($mapaDestino.Count)"
        Write-Host ""
        Write-Host "  [1] So no REPO (nunca chegaram ao servidor - o codigo usa o default):"
        if ($soNoRepo.Count -eq 0) { Write-Host "      (nenhuma)" } else { $soNoRepo | ForEach-Object { Write-Host "      $_" } }
        Write-Host ""
        Write-Host "  [2] DIVERGENTES (destino tem valor proprio - candidatas a appsettings.Production.json):"
        if ($divergentes.Count -eq 0) { Write-Host "      (nenhuma)" } else {
          $divergentes | ForEach-Object {
            if (EhSensivel $_) { Write-Host "      $_  (valor omitido: chave sensivel)" }
            else { Write-Host "      $_  repo=$($mapaRepo[$_])  destino=$($mapaDestino[$_])" }
          }
        }
        Write-Host ""
        Write-Host "  [3] So no DESTINO (config orfa ou removida do repo):"
        if ($soNoDestino.Count -eq 0) { Write-Host "      (nenhuma)" } else { $soNoDestino | ForEach-Object { Write-Host "      $_" } }
        Write-Host ""
        Write-Host "MODO DRY-RUN (fixo neste workflow) - nada foi alterado. Migracao real acontece so via deploy.yml."
