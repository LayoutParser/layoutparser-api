name: CI Dev (LayoutParserApi)

# CI/CD de DESENVOLVIMENTO - roda exclusivamente no runner local de dev (label 'dev-local').
# Deploys de producao exigem a label 'production' (ver deploy.yml): os dois pools nunca se cruzam.
# Este workflow valida o build E faz deploy LOCAL DE DEV: publica a API como servico Windows
# NATIVO (sem NSSM) no destino apontado pela Variable DEPLOY_PATH_DEV - espelho fiel de producao.

on:
  push:
    branches:
      - develop
      - 'feat/**'
  workflow_dispatch:

# Minimo necessario: so faz checkout deste repo e de LayoutParserLib/LayoutParserDecrypt
# (via GH_PAT_TOKEN, fora do escopo do GITHUB_TOKEN) - nenhum step comenta PR, cria release
# ou escreve outro recurso do GitHub. GITHUB_TOKEN nao e usado no self-hosted runner alem
# do proprio checkout.
permissions:
  contents: read

# Um push novo na mesma branch cancela o run anterior ainda em andamento
# (o runner de dev e unico - evita fila desnecessaria).
concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # NUNCA adicionar a label 'production' aqui.
    runs-on: [self-hosted, windows, dev-local]
    timeout-minutes: 30

    steps:
    - name: Checkout LayoutParserApi
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: LayoutParserApi

    # --- Gate de encoding dos workflows -------------------------------------------
    #
    # Roda PRIMEIRO e falha rapido, porque protege o deploy de PRODUCAO contra um defeito
    # que ja aconteceu de verdade em 2026-08-10: o deploy quebrou com
    #   "The string is missing the terminator" / "Missing closing '}'"
    # sem que houvesse erro de logica nenhum.
    #
    # CAUSA: o Actions escreve cada bloco `run:` como um .ps1 SEM BOM, e o Windows
    # PowerShell 5.1 le arquivo sem BOM como ANSI. Um travessao num COMENTARIO (E2 80 94
    # em UTF-8) vira tres bytes que a code page traduz em outros caracteres, um deles aspa
    # - dali em diante o parser perde o pareamento e acusa erro numa linha muito depois da
    # causa. Um acento em comentario derruba o deploy inteiro.
    #
    # O gate e simples de proposito: qualquer byte > 127 em workflow e proibido. Nao ha
    # excecao util - PT-BR sem acento e perfeitamente legivel, e o custo de errar aqui e
    # producao parada.
    - name: Validar encoding dos workflows (ASCII puro)
      run: |
        $ErrorActionPreference = "Stop"
        $raiz = Join-Path $PWD.Path "LayoutParserApi\.github\workflows"
        $problemas = 0

        foreach ($wf in (Get-ChildItem $raiz -Filter *.yml -ErrorAction SilentlyContinue)) {
          $linhas = Get-Content $wf.FullName
          for ($i = 0; $i -lt $linhas.Count; $i++) {
            $ruins = $linhas[$i].ToCharArray() | Where-Object { [int]$_ -gt 127 }
            if ($ruins) {
              $codigos = ($ruins | ForEach-Object { "U+{0:X4}" -f [int]$_ }) -join ' '
              Write-Host "  $($wf.Name):$($i + 1)  $codigos"
              Write-Host "      $($linhas[$i].Trim())"
              $problemas++
            }
          }
        }

        if ($problemas -gt 0) {
          Write-Error ("$problemas linha(s) com caractere nao-ASCII em workflow. " +
            "O PowerShell do runner le o bloco run: como ANSI e isso QUEBRA o deploy de producao. " +
            "Troque por equivalente ASCII (- em vez de travessao, [ATENCAO] em vez de emoji, sem acentos).")
          exit 1
        }

        Write-Host "Workflows em ASCII puro - seguro para o PowerShell do runner."

    # O LayoutParserApi.csproj referencia a Lib via <Reference> com HintPath relativo
    # sensivel a configuracao (..\LayoutParserLib\bin\$(Configuration)\, com fallback
    # condicional para bin\Debug quando a DLL da configuracao nao existe) - o checkout
    # lado a lado e obrigatorio, no mesmo padrao do deploy.yml.
    - name: Checkout LayoutParserLib
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: LayoutParser/layoutparser-lib
        path: layoutparser-lib
        token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    # O Decrypt e standalone (embute os fontes minimos da Lib) e compila com dotnet build -
    # o runner dev-local NAO possui VS Build Tools/msbuild.exe (nao usar setup-msbuild aqui).
    - name: Checkout LayoutParserDecrypt
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: LayoutParser/layoutparser-decrypt
        ref: develop
        path: layoutparser-decrypt
        token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Build LayoutParserLib (Debug, .NET Framework 4.8.1)
      run: |
        # Aqui a Lib e compilada em Debug e a API em Release: o HintPath da API e sensivel
        # a configuracao ($(Configuration)) e, como bin\Release da Lib nao existe neste run,
        # o fallback condicional do .csproj (!Exists -> bin\Debug) resolve a DLL - nao ha
        # obrigacao de config casada entre Lib e API.
        # A Lib e csproj legado (non-SDK) sem PackageReference: o MSBuild do SDK .NET
        # compila direto - validado no runner dev-local, que NAO possui VS Build Tools/msbuild.exe.
        $LIB_PROJECT = Join-Path $PWD.Path "layoutparser-lib\LayoutParserLib.csproj"

        if (-not (Test-Path $LIB_PROJECT)) {
          Write-Error "Projeto nao encontrado: $LIB_PROJECT"
          exit 1
        }

        dotnet build "$LIB_PROJECT" --configuration Debug

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao compilar LayoutParserLib"
          exit 1
        }

        $LIB_DLL = Join-Path $PWD.Path "layoutparser-lib\bin\Debug\LayoutParserLib.dll"
        if (-not (Test-Path $LIB_DLL)) {
          Write-Error "LayoutParserLib.dll nao foi gerada em: $LIB_DLL"
          exit 1
        }

        Write-Host "LayoutParserLib compilada (Debug): $LIB_DLL"

    - name: Build LayoutParserApi (Release)
      run: |
        $API_PROJECT = Join-Path $PWD.Path "LayoutParserApi\LayoutParserApi.csproj"

        if (-not (Test-Path $API_PROJECT)) {
          Write-Error "Projeto nao encontrado: $API_PROJECT"
          exit 1
        }

        dotnet restore "$API_PROJECT"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha no restore do LayoutParserApi"
          exit 1
        }

        $BUILD_LOG = Join-Path $PWD.Path "scs-build.log"
        dotnet build "$API_PROJECT" --configuration Release --no-restore | Tee-Object -FilePath $BUILD_LOG
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao compilar LayoutParserApi"
          exit 1
        }

        Write-Host "LayoutParserApi compilada com sucesso (Release)"

    # Gate de seguranca estatica (SAST) gratuito, sem depender do CodeQL/GitHub Advanced
    # Security - bloqueado neste repo porque e privado no plano free (decisao registrada em
    # .claude/rules/agent-authority.md). O analyzer SecurityCodeScan.VS2019 ja roda dentro do
    # `dotnet build` acima (PackageReference no LayoutParserApi.csproj) e emite achados como
    # warning MSBuild prefixado SCS####. Este step le o log salvo pelo step anterior e decide
    # o veredito por severidade:
    #   - codigos de alto risco (path traversal, CSRF, SQL/LDAP/XPath injection, XXE,
    #     deserializacao insegura) FALHAM o build visivelmente, MAS SO se forem achados NOVOS
    #     (nao presentes em security-code-scan-baseline.json - ver limitacao documentada la);
    #   - o restante (ex.: SCS0005 - gerador aleatorio fraco, hoje usado so em geracao de
    #     dado sintetico de teste, nao em criptografia/token) fica warning-only - o volume
    #     inicial (majoritariamente SCS0005) nao pode travar o deploy de dev.
    # Baseline: 27 achados de alto risco ja existentes (26x SCS0018 path traversal + 1x SCS0016
    # CSRF) foram registrados em security-code-scan-baseline.json em 2026-08-13 - sao debito
    # tecnico conhecido, nao "aprovado como seguro", e devem virar issue via @lp-pm para correcao
    # futura. O gate so bloqueia achados que NAO estejam nessa lista.
    - name: Security Code Scan - gate por severidade
      run: |
        $BUILD_LOG = Join-Path $PWD.Path "scs-build.log"

        if (-not (Test-Path $BUILD_LOG)) {
          Write-Warning "Log de build nao encontrado em $BUILD_LOG - pulando gate de SCS."
          exit 0
        }

        # Codigos SecurityCodeScan considerados High/Critical para este gate.
        $CODIGOS_ALTOS = @(
          "SCS0002",  # SQL Injection
          "SCS0003",  # Cipher fraco
          "SCS0007",  # XXE
          "SCS0016",  # CSRF
          "SCS0018",  # Path Traversal
          "SCS0026",  # LDAP Injection
          "SCS0028",  # Deserializacao insegura
          "SCS0029",  # XSS
          "SCS0031"   # XPath Injection
        )

        # Carrega o baseline de achados altos ja conhecidos (chave fragil arquivo:linha -
        # ver limitacao documentada em security-code-scan-baseline.json).
        # [ATENCAO] O checkout do repo fica em "LayoutParserApi\" dentro do workspace do
        # runner (`path: LayoutParserApi` no step "Checkout LayoutParserApi"), NAO na raiz
        # de $PWD - igual todo outro path deste workflow (LIB_PROJECT, API_PROJECT etc.).
        # O baseline foi comitado na raiz do repo (security-code-scan-baseline.json), entao
        # o caminho correto e "LayoutParserApi\security-code-scan-baseline.json", nao
        # direto em $PWD.Path. Bug real: causava "baseline nao encontrado" sempre (nao so
        # flakiness) e tratava os 27 achados conhecidos como novos, bloqueando o deploy.
        $BASELINE_FILE = Join-Path $PWD.Path "LayoutParserApi\security-code-scan-baseline.json"
        $baselineKeys = New-Object System.Collections.Generic.HashSet[string]
        if (Test-Path $BASELINE_FILE) {
          $baselineJson = Get-Content $BASELINE_FILE -Raw | ConvertFrom-Json
          foreach ($item in $baselineJson.findings) {
            [void]$baselineKeys.Add("$($item.code):$($item.file):$($item.line)")
          }
          Write-Host "Baseline carregado: $($baselineKeys.Count) achado(s) conhecido(s) em $BASELINE_FILE"
        } else {
          Write-Warning "security-code-scan-baseline.json nao encontrado - todo achado alto sera tratado como novo."
        }

        $linhas = Get-Content $BUILD_LOG | Where-Object { $_ -match "warning SCS\d+" }
        $totalPorCodigo = @{}
        $achadosConhecidos = New-Object System.Collections.Generic.HashSet[string]
        $achadosNovos = New-Object System.Collections.Generic.HashSet[string]

        foreach ($linha in $linhas) {
          if ($linha -match "warning (SCS\d+)") {
            $codigo = $Matches[1]
            if (-not $totalPorCodigo.ContainsKey($codigo)) { $totalPorCodigo[$codigo] = 0 }
            $totalPorCodigo[$codigo]++

            if ($CODIGOS_ALTOS -contains $codigo -and $linha -match '(?<file>[A-Za-z]:[^():]+\.cs)\((?<line>\d+),(?<col>\d+)\):') {
              $relFile = $Matches.file -replace '\\', '/'
              foreach ($marker in @('/Controllers/', '/Services/')) {
                $idx = $relFile.IndexOf($marker)
                if ($idx -ge 0) {
                  $relFile = $relFile.Substring($idx + 1)
                  break
                }
              }
              $chave = "$($codigo):$($relFile):$($Matches.line)"
              if ($baselineKeys.Contains($chave)) {
                [void]$achadosConhecidos.Add($chave)
              } else {
                [void]$achadosNovos.Add($chave)
              }
            }
          }
        }

        Write-Host "Achados do SecurityCodeScan por codigo:"
        foreach ($codigo in $totalPorCodigo.Keys) {
          Write-Host "  $codigo : $($totalPorCodigo[$codigo])"
        }

        if ($achadosConhecidos.Count -gt 0) {
          Write-Host ""
          Write-Host "Achados de severidade ALTA ja no baseline (nao bloqueiam - debito tecnico conhecido):"
          $achadosConhecidos | Sort-Object | ForEach-Object { Write-Host "  $_" }
        }

        if ($achadosNovos.Count -gt 0) {
          Write-Host ""
          Write-Host "Achados de severidade ALTA NOVOS (bloqueiam o deploy):"
          $achadosNovos | Sort-Object | ForEach-Object { Write-Host "  $_" }
          Write-Error "SecurityCodeScan encontrou $($achadosNovos.Count) achado(s) NOVO(S) de severidade alta/critica (fora do baseline). Corrija, ou se for falso-positivo/debito aceito conscientemente, adicione ao security-code-scan-baseline.json."
          exit 1
        }

        Write-Host "Nenhum achado de severidade alta/critica NOVO - gate de SCS OK (baseline conhecido e warnings de menor severidade nao bloqueiam)."

    # Quality gate de verdade. Antes deste step o CI nao rodava teste nenhum, e o
    # `dotnet test` na solution reportava SUCESSO tendo executado ZERO testes - um gate que
    # mentia. Duas coisas mudaram junto com este step:
    #   - tests/LayoutParserApi.Tests entrou na LayoutParserApi.sln (antes ficava de fora);
    #   - deploy.yml passou a buildar o .csproj EXPLICITAMENTE, para que a entrada dos testes
    #     na solution nao faca o deploy de producao restaurar xUnit e compilar testes.
    # O caminho do .csproj fica explicito aqui de proposito: nao dependemos de inferencia.
    # Teste vermelho BLOQUEIA o deploy de dev - e o ponto do gate.
    - name: Testes (xUnit)
      run: |
        $TEST_PROJECT = Join-Path $PWD.Path "LayoutParserApi\tests\LayoutParserApi.Tests\LayoutParserApi.Tests.csproj"

        if (-not (Test-Path $TEST_PROJECT)) {
          Write-Error "Projeto de testes nao encontrado: $TEST_PROJECT"
          exit 1
        }

        dotnet test "$TEST_PROJECT" --configuration Release --logger "console;verbosity=minimal"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Testes falharam - deploy de dev abortado."
          exit 1
        }

        Write-Host "Suite de testes verde."

    # -- Deploy local de DEV (servico Windows NATIVO) --------------------------------

    # Tolerante a falha: o exe do Decrypt raramente muda - se o build quebrar,
    # seguimos com o binario que ja existir no destino.
    - name: Build LayoutParserDecrypt (Release, .NET Framework 4.8.1)
      run: |
        $DECRYPT_PROJECT = Join-Path $PWD.Path "layoutparser-decrypt\LayoutParserDecrypt.csproj"

        if (-not (Test-Path $DECRYPT_PROJECT)) {
          Write-Warning "Projeto nao encontrado: $DECRYPT_PROJECT - seguindo sem rebuild do Decrypt."
          exit 0
        }

        dotnet build "$DECRYPT_PROJECT" --configuration Release
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "Falha ao compilar LayoutParserDecrypt - seguindo com o binario existente (o exe raramente muda)."
        } else {
          Write-Host "LayoutParserDecrypt compilado (Release)."
        }
        exit 0

    - name: Publish LayoutParserApi (Release)
      run: |
        $API_PROJECT = Join-Path $PWD.Path "LayoutParserApi\LayoutParserApi.csproj"
        $PUBLISH_OUTPUT = Join-Path $PWD.Path "publish-api"

        # --no-build reaproveita o build Release do step anterior (restore + build ja rodaram).
        dotnet publish "$API_PROJECT" --configuration Release --no-build --output "$PUBLISH_OUTPUT"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Falha ao publicar LayoutParserApi"
          exit 1
        }

        $API_EXE = Join-Path $PUBLISH_OUTPUT "LayoutParserApi.exe"
        if (-not (Test-Path $API_EXE)) {
          Write-Error "LayoutParserApi.exe nao foi gerado em: $PUBLISH_OUTPUT"
          exit 1
        }
        Write-Host "Publish concluido em: $PUBLISH_OUTPUT"

    # DEPLOY_PATH_DEV e uma *Variable* do repositorio (path nao e segredo).
    # Nesta maquina de dev o valor esperado e: C:\inetpub\wwwroot\layoutparser
    - name: Validar destino do deploy (DEPLOY_PATH_DEV)
      env:
        DEPLOY_PATH_DEV: ${{ vars.DEPLOY_PATH_DEV }}
        API_URL_DEV: ${{ vars.API_URL_DEV }}
      run: |
        $DEPLOY_PATH = "$env:DEPLOY_PATH_DEV".Trim('"', "'", ' ')
        if ([string]::IsNullOrWhiteSpace($DEPLOY_PATH)) {
          Write-Error ("A Variable DEPLOY_PATH_DEV nao esta configurada! " +
            "Crie em: GitHub -> repo LayoutParserApi -> Settings -> Secrets and variables -> Actions -> aba Variables. " +
            "Nesta maquina de dev o valor esperado e: C:\inetpub\wwwroot\layoutparser")
          exit 1
        }

        # URL da instancia de dev: a porta 5100 evita colidir com o dotnet run do dev (5000).
        $API_URL = "$env:API_URL_DEV".Trim('"', "'", ' ', '/')
        if ([string]::IsNullOrWhiteSpace($API_URL)) { $API_URL = "http://localhost:5100" }

        Add-Content -Path $env:GITHUB_ENV -Value "DEPLOY_PATH_RESOLVED=$DEPLOY_PATH"
        Add-Content -Path $env:GITHUB_ENV -Value "API_URL_RESOLVED=$API_URL"
        Write-Host "Destino do deploy: $DEPLOY_PATH"
        Write-Host "URL da API (dev): $API_URL"

    # Parar ANTES de copiar (exe travado se o processo estiver rodando).
    # Se o servico existente for o legado do NSSM, ele e removido aqui e recriado
    # como servico Windows NATIVO no step de criacao (migracao NSSM -> nativo).
    - name: Parar servico (e remover NSSM legado, se houver)
      run: |
        $serviceName = "LayoutParserApi"
        $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if (-not $svc) {
          Write-Host "Servico $serviceName nao existe ainda - sera criado adiante."
          exit 0
        }

        $imagePath = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" -ErrorAction SilentlyContinue).ImagePath
        Write-Host "Servico existente (Status=$($svc.Status)). ImagePath: $imagePath"

        if ($svc.Status -ne 'Stopped') {
          Write-Host "Parando servico..."
          Stop-Service -Name $serviceName -Force -ErrorAction Stop
          try {
            $svc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
          } catch {
            Write-Error "Timeout ao parar o servico $serviceName - abortando para nao copiar sobre exe em uso."
            exit 1
          }
          Write-Host "Servico parado."
        }

        if ($imagePath -match 'nssm') {
          Write-Host "MIGRACAO NSSM -> NATIVO: servico legado gerenciado pelo NSSM detectado."
          Write-Host "Removendo o registro do servico para recria-lo como servico Windows nativo..."
          sc.exe delete $serviceName | Out-Null
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 2
            if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) { break }
          }
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Write-Error "Servico ainda presente apos delete (marcado para exclusao?). Feche services.msc/handles e re-execute o workflow."
            exit 1
          }
          Write-Host "Servico NSSM removido - sera recriado como nativo."
        }

    # -- Sidecar Decrypt (servico Windows): parar ANTES de copiar/reinstalar -----------------
    #
    # Desde o #569 a API descriptografa via HTTP (LayoutParserDecrypt:BaseUrl). O repo
    # layoutparser-decrypt (develop) agora traz o servico Windows nativo (ServiceBase) e o
    # scripts/install-service.ps1 (urlacl + firewall + env do servico). Este step para o servico
    # e remove a TAREFA AGENDADA legada (introduzida no PR #586, substituida por este modelo).
    - name: Parar sidecar Decrypt (servico Windows e tarefa legada)
      run: |
        $svcName = "LayoutParserDecrypt"
        $svc = Get-Service -Name $svcName -ErrorAction SilentlyContinue
        if ($svc -and $svc.Status -ne 'Stopped') {
          Write-Host "Parando servico $svcName..."
          Stop-Service -Name $svcName -Force -ErrorAction SilentlyContinue
          try { $svc.WaitForStatus('Stopped', '00:00:30') } catch { Write-Warning "Servico nao parou em 30s." }
        }
        # Migracao: remove a tarefa agendada legada, se existir.
        $legacy = "LayoutParserDecrypt-Sidecar"
        if (Get-ScheduledTask -TaskName $legacy -ErrorAction SilentlyContinue) {
          Write-Host "Removendo tarefa agendada legada $legacy..."
          Stop-ScheduledTask -TaskName $legacy -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName $legacy -Confirm:$false -ErrorAction SilentlyContinue
        }
        # Garante que nenhum LayoutParserDecrypt.exe siga segurando porta/arquivo (best-effort).
        Get-Process -Name "LayoutParserDecrypt" -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "Encerrando processo LayoutParserDecrypt PID $($_.Id)..."
          Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
        }
        Start-Sleep -Seconds 2

    - name: Backup do appsettings e copia dos artefatos
      run: |
        $DEPLOY_PATH = $env:DEPLOY_PATH_RESOLVED
        $API_DEST = Join-Path $DEPLOY_PATH "api"
        $BACKUPS = Join-Path $DEPLOY_PATH "backups"
        $SRC = Join-Path $PWD.Path "publish-api"

        New-Item -ItemType Directory -Path $API_DEST -Force | Out-Null
        New-Item -ItemType Directory -Path $BACKUPS -Force | Out-Null

        # Preservacao do appsettings.json do destino (mesma politica do deploy.yml):
        # se ja existe um no servidor, ele NAO e sobrescrito - apenas backupeado.
        $destAppSettings = Join-Path $API_DEST "appsettings.json"
        $preserveAppSettings = Test-Path $destAppSettings
        if ($preserveAppSettings) {
          $backupName = "appsettings-$(Get-Date -Format 'yyyyMMdd-HHmmss').json"
          Copy-Item -Path $destAppSettings -Destination (Join-Path $BACKUPS $backupName) -Force
          Write-Host "Backup do appsettings.json do destino: backups\$backupName"
        } else {
          Write-Host "Destino sem appsettings.json (primeiro deploy?) - o do publish sera usado."
        }

        # Best-effort: mata processo(s) orfaos rodando a partir de $API_DEST fora do
        # servico gerenciado (ex.: alguem executou o .exe/dotnet manualmente da pasta
        # de deploy), que deixam handle aberto em DLLs e derrubam o Copy-Item abaixo.
        # Nao falha o step se nada for encontrado; se o Copy-Item falhar mesmo assim,
        # o erro real continua propagando normalmente (sem mascarar).
        try {
          $orphans = Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Path -and $_.Path.StartsWith($API_DEST, [StringComparison]::OrdinalIgnoreCase)
          }
          if ($orphans) {
            foreach ($proc in $orphans) {
              Write-Host "Processo orfao encontrado em $API_DEST : $($proc.ProcessName) (PID $($proc.Id)) - $($proc.Path). Encerrando..."
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 2
          } else {
            Write-Host "Nenhum processo orfao rodando a partir de $API_DEST."
          }
        } catch {
          Write-Warning "Falha ao verificar/encerrar processos orfaos em $API_DEST (best-effort, seguindo): $_"
        }

        # -- Clean deploy: remove do destino o que NAO faz parte do publish atual --------------
        # Mesma estrategia do deploy.yml (docs/architecture/clean-deploy-estrategia-2026-09-07.md):
        # sem isso, um arquivo removido/renomeado no repo ficava para sempre em $API_DEST, de
        # deploy em deploy. Preserva a pasta Logs/logs inteira (Logging:File:Directory aponta para
        # dentro de $API_DEST\logs) e appsettings.json (ja tratado acima via $preserveAppSettings -
        # aqui so garante que a limpeza generica nao o apague). Diff entre destino e publish atual,
        # nao um rm -rf; falha ao remover um arquivo individual e best-effort.
        if (Test-Path $API_DEST) {
          # 'lowcode-runner' = runner low-code publicado por um step posterior (issue #373),
          # fora do publish da API - nao pode ser tratado como orfao no proximo deploy.
          $preservarPastasTopo = @('logs', 'lowcode-runner')
          $preservarArquivos = @('appsettings.json')

          $novosRelativos = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem -Path $SRC -Recurse -File | ForEach-Object {
            [void]$novosRelativos.Add($_.FullName.Substring($SRC.Length + 1))
          }
          foreach ($extra in @('LayoutParserDecrypt.exe', 'LayoutParserDecrypt.exe.config', 'LayoutParserLib.dll', 'LayoutParserLowCodeRunner.exe.config')) {
            [void]$novosRelativos.Add($extra)
          }

          $removidos = 0
          Get-ChildItem -Path $API_DEST -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            $relExistente = $_.FullName.Substring($API_DEST.Length + 1)
            $primeiraPasta = ($relExistente -split '[\\/]')[0]
            $preservar = ($preservarPastasTopo -contains $primeiraPasta.ToLowerInvariant()) -or
                         ($preservarArquivos -contains $relExistente.ToLowerInvariant()) -or
                         ($relExistente -like 'appsettings.*.local.json') -or
                         ($relExistente -eq 'appsettings.Local.json') -or
                         ($novosRelativos.Contains($relExistente))
            if (-not $preservar) {
              try {
                Remove-Item -Path $_.FullName -Force -ErrorAction Stop
                $removidos++
              } catch {
                Write-Warning "Clean deploy: falha ao remover orfao $relExistente (best-effort, seguindo): $($_.Exception.Message)"
              }
            }
          }
          Write-Host "Clean deploy: $removidos arquivo(s) orfao(s) removido(s) de $API_DEST."

          Get-ChildItem -Path $API_DEST -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              $preservarPastasTopo -notcontains $_.Name.ToLowerInvariant() -and
              (Get-ChildItem -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue).Count -eq 0
            } |
            Sort-Object { $_.FullName.Length } -Descending |
            ForEach-Object { Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue }
        }

        Write-Host "Copiando publish-api -> $API_DEST (preservar appsettings: $preserveAppSettings)..."
        if ($preserveAppSettings) {
          Copy-Item -Path (Join-Path $SRC '*') -Destination $API_DEST -Recurse -Force -Exclude 'appsettings.json'
        } else {
          Copy-Item -Path (Join-Path $SRC '*') -Destination $API_DEST -Recurse -Force
        }

        # LayoutParserDecrypt.exe (+ config) - processo externo de descriptografia.
        $DECRYPT_BIN = Join-Path $PWD.Path "layoutparser-decrypt\bin\Release"
        # O csproj do Decrypt e SDK-style (net48): a saida vai para bin\Release\net48. Sem isto o exe novo
        # nao era copiado e o sidecar rodava o binario legado (CLI) que ficou no destino.
        $DECRYPT_NET48 = Join-Path $DECRYPT_BIN "net48"
        if (Test-Path (Join-Path $DECRYPT_NET48 "LayoutParserDecrypt.exe")) { $DECRYPT_BIN = $DECRYPT_NET48 }
        foreach ($f in @('LayoutParserDecrypt.exe', 'LayoutParserDecrypt.exe.config')) {
          $p = Join-Path $DECRYPT_BIN $f
          if (Test-Path $p) {
            Copy-Item -Path $p -Destination $API_DEST -Force
            Write-Host "  $f copiado."
          } else {
            Write-Warning "  $f nao encontrado em $DECRYPT_BIN - mantendo o que existir no destino."
          }
        }

        # LayoutParserLib.dll ja vem no publish da API (Reference/HintPath);
        # fallback: copiar da build Debug da Lib se por algum motivo faltar.
        $libInDest = Join-Path $API_DEST "LayoutParserLib.dll"
        if (-not (Test-Path $libInDest)) {
          $libDll = Join-Path $PWD.Path "layoutparser-lib\bin\Debug\LayoutParserLib.dll"
          if (Test-Path $libDll) {
            Copy-Item -Path $libDll -Destination $API_DEST -Force
            Write-Host "  LayoutParserLib.dll copiada (fallback da build Debug)."
          } else {
            Write-Warning "  LayoutParserLib.dll ausente no destino e no fallback!"
          }
        }

        $count = (Get-ChildItem -Path $API_DEST -File -Recurse | Measure-Object).Count
        Write-Host "Copia concluida ($count arquivos no destino)."

    # Servico Windows NATIVO (Program.cs usa builder.Host.UseWindowsService()).
    #
    # [ATENCAO] ESTE E O UNICO CANAL DE CONFIGURACAO QUE CHEGA AO DESTINO. O step de copia acima
    # preserva o appsettings.json do servidor (`-Exclude 'appsettings.json'`), entao chave
    # nova adicionada ao appsettings.json do REPO nao tem efeito nenhum no destino - o codigo
    # cai no default em silencio. Toda config nova entra aqui, como `Section__Key`.
    #
    # O ambiente do servico vive em HKLM\...\Services\LayoutParserApi\Environment (REG_MULTI_SZ):
    #   - Kestrel__Endpoints__Http__Url: porta da instancia de dev (o appsettings fixa 5000).
    #   - Database__Password: injetada do secret DB_PASSWORD_DEV (NUNCA ecoar o valor).
    #   - IdentityDatabase__Server/Database: SQL dedicado de identidade (172.25.32.5), das
    #     variables IDENTITY_DB_SERVER/IDENTITY_DB_NAME (nao sensiveis).
    #   - IdentityDatabase__UserId/Password: injetadas dos secrets IDENTITY_DB_USERID/
    #     IDENTITY_DB_PASSWORD (NUNCA ecoar o valor).
    #   - LowCode__Package: sem ele o runner sai com exit 9 e NENHUMA transformacao acontece.
    #   - LowCode__RunnerTimeoutSeconds: o default de 15s mata o runner no meio, sempre.
    #   - ML__LowCodeTransformationsPath: tira o store de dentro da pasta que o deploy sobrescreve.
    #   - AiMetrics__IngestApiKey: sem ela a ingestao de metricas de IA e recusada.
    #   - LowCode__RunnerPath: resolvido pelo step de publicacao do runner, logo abaixo.

    # -- Publicacao do runner low-code (pasta Functions do repo) -------------------
    #
    # Mesma abordagem do deploy.yml (issue #373). O runner e net481/x86 e resolve dependencias
    # pelo diretorio do PROPRIO .exe. Desde a issue #391/#392 a pasta versionada
    # `tools/LowCodeRunner/Functions/` carrega log4net 2.0.17.0 ao lado de SysMiddle.Base.dll -
    # virou um runtime home completo, sem precisar procurar uma Bin de AppConnector de terceiros.
    #
    # Copia `Functions/` INTEIRA para `<deploy>\api\lowcode-runner\` e resolve
    # LOWCODE_RUNNER_PATH_RESOLVED para o `.exe` nesse local (consumido pelo step de Environment;
    # o appsettings.json do destino e preservado, entao esse caminho so chega a API por env var).
    # `lowcode-runner` esta na allowlist do clean-deploy abaixo.
    #
    # Nao e fatal: Functions/ ausente ou log4net regredido -> avisa e segue; a API sobe, so o
    # pathway low-code fica indisponivel.
    - name: Publicar runner low-code (pasta Functions do repo)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $DEPLOY_PATH = $env:DEPLOY_PATH_RESOLVED
        if ([string]::IsNullOrWhiteSpace($DEPLOY_PATH)) {
          Write-Warning "DEPLOY_PATH_RESOLVED vazio - runner low-code nao sera publicado."
          exit 0
        }

        $runnerSrc = Join-Path $PWD.Path "LayoutParserApi\tools\LowCodeRunner\Functions"
        $runnerExe = Join-Path $runnerSrc "LayoutParserLowCodeRunner.exe"
        if (-not (Test-Path $runnerExe)) {
          Write-Warning "Runner nao encontrado no checkout: $runnerExe - pathway low-code seguira indisponivel."
          exit 0
        }

        # Aptidao: SysMiddle.Base.dll + log4net 2.x ao lado do .exe. Regressao -> nao publica.
        $l4n = Join-Path $runnerSrc "log4net.dll"
        $l4nVer = if (Test-Path $l4n) { (Get-Item $l4n).VersionInfo.FileVersion } else { "(ausente)" }
        $temBase = Test-Path (Join-Path $runnerSrc "SysMiddle.Base.dll")
        if ((-not $temBase) -or ($l4nVer -notlike "2.*")) {
          Write-Warning "Functions/ nao esta apta (SysMiddle.Base.dll presente=$temBase, log4net=$l4nVer) - runner nao publicado."
          exit 0
        }

        $destino = Join-Path $DEPLOY_PATH "api\lowcode-runner"
        if (Test-Path $destino) { Remove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue }
        New-Item -ItemType Directory -Path $destino -Force | Out-Null
        Copy-Item -Path (Join-Path $runnerSrc "*") -Destination $destino -Recurse -Force

        $publicado = Join-Path $destino "LayoutParserLowCodeRunner.exe"
        if (-not (Test-Path $publicado)) {
          Write-Warning "Falha ao copiar o runner para $destino - pathway low-code seguira indisponivel."
          exit 0
        }
        $qtd = (Get-ChildItem $destino -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
        Write-Host "Runner low-code publicado em: $publicado ($qtd arquivos, log4net $l4nVer)"

        Add-Content -Path $env:GITHUB_ENV -Value "LOWCODE_RUNNER_PATH_RESOLVED=$publicado"

    - name: Criar/configurar servico Windows nativo
      env:
        DB_PASSWORD_DEV: ${{ secrets.DB_PASSWORD_DEV }}
        AI_METRICS_INGEST_KEY_DEV: ${{ secrets.AI_METRICS_INGEST_KEY_DEV }}
        IDENTITY_DB_USERID: ${{ secrets.IDENTITY_DB_USERID }}
        IDENTITY_DB_PASSWORD: ${{ secrets.IDENTITY_DB_PASSWORD }}
        IDENTITY_DB_SERVER: ${{ vars.IDENTITY_DB_SERVER }}
        IDENTITY_DB_NAME: ${{ vars.IDENTITY_DB_NAME }}
      run: |
        $serviceName = "LayoutParserApi"
        $exePath = Join-Path $env:DEPLOY_PATH_RESOLVED "api\LayoutParserApi.exe"

        if (-not (Test-Path $exePath)) {
          Write-Error "Executavel nao encontrado: $exePath"
          exit 1
        }

        if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
          Write-Host "Criando servico Windows NATIVO $serviceName..."
          # Aspas embutidas via variavel (idiom de PowerShell) para o ImagePath ficar citado no registro.
          $binPath = '"{0}"' -f $exePath
          sc.exe create $serviceName binPath= $binPath start= auto
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao criar o servico (sc create retornou $LASTEXITCODE)"
            exit 1
          }
          sc.exe description $serviceName "LayoutParser API (ASP.NET Core) - servico Windows nativo, deploy via CI dev" | Out-Null
          # Auto-restart em falha: ate 3 restarts com 60s de intervalo; contador zera em 24h.
          sc.exe failure $serviceName reset= 86400 actions= restart/60000/restart/60000/restart/60000 | Out-Null
          Write-Host "Servico criado (start=auto, failure actions configuradas)."
        } else {
          Write-Host "Servico $serviceName ja existe - binarios atualizados, registro mantido."
        }

        # Ambiente do servico - reescrito a cada deploy (idempotente).
        # NUNCA dar echo em valores: o REG_MULTI_SZ e montado em variavel e gravado direto.
        # Aqui o CI e dono UNICO do Environment (maquina de dev), entao a reescrita em bloco
        # e deliberada. Em producao NAO e assim: o deploy.yml faz upsert e preserva chaves
        # definidas manualmente - a senha do SQL de producao vive la fora do CI.
        $envList = @("Kestrel__Endpoints__Http__Url=$($env:API_URL_RESOLVED)")

        if (-not [string]::IsNullOrWhiteSpace($env:DB_PASSWORD_DEV)) {
          $envList += "Database__Password=$($env:DB_PASSWORD_DEV)"
        } else {
          Write-Warning ("Secret DB_PASSWORD_DEV vazio - a API subira DEGRADADA (sem SQL) ate configurarem o secret " +
            "em: GitHub -> Settings -> Secrets and variables -> Actions -> aba Secrets.")
        }

        # IdentityDatabase:* - SQL Server dedicado (172.25.32.5) para identidade/workspace,
        # substituindo o uso indevido do banco Sysmiddle ConnectUS_Macgyver (Error 1770 de FK
        # em SqlIdentityWorkspaceStore.cs). Server/Database sao variables (nao sensiveis);
        # UserId/Password sao secrets. Sem eles, a API sobe fail-closed negando UserId ate o
        # secret/variable ser configurado.
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_SERVER)) {
          $envList += "IdentityDatabase__Server=$($env:IDENTITY_DB_SERVER)"
        } else {
          Write-Warning "Variable IDENTITY_DB_SERVER vazia - IdentityDatabase:Server nao sera definida."
        }
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_NAME)) {
          $envList += "IdentityDatabase__Database=$($env:IDENTITY_DB_NAME)"
        } else {
          Write-Warning "Variable IDENTITY_DB_NAME vazia - IdentityDatabase:Database nao sera definida."
        }
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_USERID)) {
          $envList += "IdentityDatabase__UserId=$($env:IDENTITY_DB_USERID)"
        } else {
          Write-Warning "Secret IDENTITY_DB_USERID vazio - IdentityDatabase:UserId nao sera definida."
        }
        if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_DB_PASSWORD)) {
          $envList += "IdentityDatabase__Password=$($env:IDENTITY_DB_PASSWORD)"
        } else {
          Write-Warning ("Secret IDENTITY_DB_PASSWORD vazio - a API subira sem acesso ao banco de identidade " +
            "ate configurarem o secret em: GitHub -> Settings -> Secrets and variables -> Actions -> aba Secrets.")
        }

        # LowCode__Package - NAO e segredo (identificador do projeto Sysmiddle), por isso vai
        # literal no workflow e nao via secret. Valor de referencia:
        # Instance_FiatMQ\AppConnector.DIR\Conf\config.xml -> <PackageMappers>.
        # Vazio => o runner recusa com exit code proprio e TODA transformacao falha.
        $envList += "LowCode__Package=938f9978-836f-48c1-9c0f-c2898caf4b20"

        # LowCode__RunnerTimeoutSeconds - o default do codigo e 15s (LowCodeRunnerOptions.cs).
        # Medicao real na maquina de dev: `ExecuteMapper` sozinho leva 38-73s; a transformacao
        # completa, 48-137s (a init de licenca do InstanceFactory responde por 12-38s e NAO saiu
        # com a remocao do bootstrap). Com 15s o processo e morto no meio SEMPRE - configurar o
        # package e deixar o timeout em 15s nao entrega transformacao nenhuma.
        # 180s = ~30% de folga sobre os 137s do pior caso medido, que ja e o pior de uma faixa
        # com variacao de 3x na MESMA build. Nao ha valor "justo": subdimensionar mata trabalho
        # bom; superdimensionar so atrasa a deteccao de travamento, que e o erro barato.
        # O efeito de segunda ordem que este valor teria no budget do multi-candidato
        # (RunnerTimeoutSeconds * MaxConcurrentRunners => 360s segurando o cliente) JA FOI
        # CORRIGIDO no codigo: a formula virou min(ondas x timeout, CandidatesRequestTimeoutSeconds)
        # em LowCodeCandidatesBudget.cs. Nada a configurar aqui - o default de 90s ja e seguro.
        $envList += "LowCode__RunnerTimeoutSeconds=180"

        # LayoutParserDecrypt__BaseUrl - desde o #569 a API descriptografa via HTTP no sidecar
        # (step "Instalar e iniciar servico Decrypt"). O appsettings.json do destino e PRESERVADO,
        # entao a chave do repo nao chega ao dev: sem esta env var, BaseUrl fica vazio, o decryptor
        # fica Degraded e o catalogo sobe vazio. Porta 5220 = default do sidecar; manter coerente.
        $envList += "LayoutParserDecrypt__BaseUrl=http://localhost:5220/"

        # LowCode__RunnerPath - resolvido pelo step de publicacao acima (aponta para
        # <deploy>\api\lowcode-runner\LayoutParserLowCodeRunner.exe, copia da pasta Functions/ do
        # repo). So e definido quando o runner foi realmente publicado; do contrario a chave nao
        # entra e a API segue com o caminho do appsettings.
        if (-not [string]::IsNullOrWhiteSpace($env:LOWCODE_RUNNER_PATH_RESOLVED)) {
          $envList += "LowCode__RunnerPath=$($env:LOWCODE_RUNNER_PATH_RESOLVED)"
        } else {
          Write-Warning "Runner low-code nao publicado neste host - LowCode__RunnerPath nao sera definido."
        }

        # ML__LowCodeTransformationsPath - o default e AppContext.BaseDirectory\MLData\...,
        # ou seja, DENTRO de <deploy>\api, a pasta que o deploy reescreve a cada release.
        # Movido para fora, ao lado do ML:LearningDataPath que ja e externo.
        $lowCodeStore = Join-Path $env:DEPLOY_PATH_RESOLVED 'MLData\LowCodeTransformations'
        New-Item -ItemType Directory -Path $lowCodeStore -Force | Out-Null
        $envList += "ML__LowCodeTransformationsPath=$lowCodeStore"

        # Security__ApiKey - REMOVIDO (2026-08-12). O ApiKeyGateFilter/ApiKeyGatePolicy foram
        # excluidos do codigo em `feat/identidade-do-bff`: a defesa BFF->API passou a ser rede
        # (bind em loopback) + TrustedIdentityMiddleware, nao chave compartilhada. O secret
        # API_KEY_DEV fica sem consumidor - ver docs/architecture/rollout-p2-autenticacao.md.

        # AiMetrics__IngestApiKey - sem ela o AiMetricsIngestKeyFilter recusa toda escrita de
        # metricas de IA (pendencia antiga do Gap 3). Opcional: ausente, o deploy segue.
        if (-not [string]::IsNullOrWhiteSpace($env:AI_METRICS_INGEST_KEY_DEV)) {
          $envList += "AiMetrics__IngestApiKey=$($env:AI_METRICS_INGEST_KEY_DEV)"
        } else {
          Write-Warning ("Secret AI_METRICS_INGEST_KEY_DEV ausente - a ingestao de metricas de IA continuara RECUSADA. " +
            "Crie em: GitHub -> Settings -> Secrets and variables -> Actions -> aba Secrets.")
        }

        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" -Name "Environment" -Value ([string[]]$envList) -Type MultiString
        Write-Host "Ambiente do servico configurado ($($envList.Count) variavel(is) definida(s))."
        Write-Host "  Chaves: $(($envList | ForEach-Object { ($_ -split '=', 2)[0] }) -join ', ')"

    # -- Sidecar Decrypt (servico Windows): instalar via install-service.ps1 e validar /health --
    # Roda depois da copia dos artefatos e ANTES do smoke test da API: sem o sidecar de pe,
    # o catalogo sobe vazio (decryptor Degraded) e o /health/ready da API nunca fica 200.
    # Usa o script do repo layoutparser-decrypt (checkout na develop, exe em bin\Release\net48).
    # No dev a API roda no MESMO host: bind em localhost:5220 (sem regra de firewall). O runner
    # precisa de privilegio de administrador (o script exige PowerShell elevado). Nenhum segredo.
    - name: Instalar e iniciar servico Decrypt (install-service.ps1)
      run: |
        $porta = 5220
        $healthUrl = "http://localhost:$porta/health"
        $script = Join-Path $PWD.Path "layoutparser-decrypt\scripts\install-service.ps1"
        $exe = Join-Path $PWD.Path "layoutparser-decrypt\bin\Release\net48\LayoutParserDecrypt.exe"

        foreach ($p in @($script, $exe)) {
          if (-not (Test-Path $p)) {
            Write-Error "Nao encontrado: $p (o checkout do layoutparser-decrypt precisa estar na develop e o build Release concluido)."
            exit 1
          }
        }

        & $script -ExeSource $exe -BindAddress localhost -Port $porta
        if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
          Write-Error "install-service.ps1 falhou (exit $LASTEXITCODE)."
          exit 1
        }

        # O script so emite aviso se o /health nao responder: aqui falhamos de verdade (ate ~60s).
        $ok = $false
        for ($i = 1; $i -le 30; $i++) {
          try {
            $resp = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 3
            if ([int]$resp.StatusCode -eq 200) { $ok = $true; break }
          } catch { }
          Start-Sleep -Seconds 2
        }

        if (-not $ok) {
          Write-Host "--- Diagnostico do servico Decrypt ---"
          $s = Get-Service -Name "LayoutParserDecrypt" -ErrorAction SilentlyContinue
          Write-Host ("Servico: " + $(if ($s) { $s.Status } else { "NAO instalado" }))
          $logDir = "C:\ProgramData\LayoutParserDecrypt\logs"
          $ultimo = Get-ChildItem -Path $logDir -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($ultimo) {
            Write-Host "--- Fim de $($ultimo.Name) ---"
            Get-Content -Path $ultimo.FullName -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          }
          Write-Error "Servico Decrypt nao respondeu HTTP 200 em $healthUrl em ~60s. Deploy de dev abortado antes do smoke test da API."
          exit 1
        }
        Write-Host "Servico Decrypt OK: HTTP 200 em $healthUrl."

    - name: Iniciar servico e smoke test
      run: |
        $serviceName = "LayoutParserApi"

        Write-Host "Iniciando servico $serviceName..."
        try {
          Start-Service -Name $serviceName -ErrorAction Stop
          $svc = Get-Service -Name $serviceName
          $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
        } catch {
          Write-Error "Falha ao iniciar o servico: $($_.Exception.Message)"
          Write-Host "--- Ultimos eventos: System / Service Control Manager ---"
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 8 -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("[{0}] {1}" -f $_.TimeCreated, ($_.Message -split "`n")[0]) }
          Write-Host "--- Ultimos eventos: Application (.NET) ---"
          Get-WinEvent -LogName Application -MaxEvents 12 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match '\.NET|LayoutParser|Windows Error' } |
            ForEach-Object { Write-Host ("[{0}] {1}: {2}" -f $_.TimeCreated, $_.ProviderName, ($_.Message -split "`n")[0]) }
          exit 1
        }

        # Janela do SCM: se o processo nao estiver integrado ao SCM (sem UseWindowsService),
        # ele morre logo apos o start (erro 1053) - conferimos que CONTINUA Running.
        Start-Sleep -Seconds 8
        $svc = Get-Service -Name $serviceName
        if ($svc.Status -ne 'Running') {
          Write-Error "Servico caiu logo apos o start (Status=$($svc.Status)) - provavel falha de inicializacao."
          Get-WinEvent -LogName Application -MaxEvents 12 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match '\.NET|LayoutParser|Windows Error' } |
            ForEach-Object { Write-Host ("[{0}] {1}: {2}" -f $_.TimeCreated, $_.ProviderName, ($_.Message -split "`n")[0]) }
          exit 1
        }
        Write-Host "Servico Running (estavel apos 8s)."

        # Smoke test de READINESS: bate em /health/ready exigindo 200 ESTRITO. A sonda roda
        # SELECT 1 no SQL e confere o warm-up do catalogo; readiness Unhealthy responde 503 e
        # FALHA o deploy. Antes este step batia numa rota de negocio (/api/document/layouts)
        # aceitando ate 404 como sucesso - validava "a API responde HTTP", nao "a API funciona":
        # um catalogo vazio porque o decryptor quebrou passava batido. Redis/runner fora sao
        # Degraded -> 200, entao nao derrubam o dev por dependencia opcional.
        $smokeUrl = "$($env:API_URL_RESOLVED)/health/ready"

        # /health/ready e ANONIMO: e mapeado por MapHealthChecks (endpoint routing). O
        # ApiKeyGateFilter foi REMOVIDO do codigo (2026-08-12, `feat/identidade-do-bff`) -
        # nao ha mais gate de chave a considerar aqui, nem no resto da API.
        $smokeHeaders = @{}

        # Readiness pode responder 503 durante o warm-up do catalogo (dependencia essencial ainda
        # subindo). 503 NAO e sucesso e tambem NAO e falha definitiva: e "ainda nao pronto" - por
        # isso o laco RETENTA ate 200 ou esgotar. So 200 encerra com sucesso.
        #
        # [ATUALIZADO 2026-08-21] Causa raiz original investigada em 2026-08-13 (run 31687154272):
        # o warm-up do catalogo (CachePermanentWarmupBackgroundService) rodava UMA UNICA VEZ apos
        # o app subir, sem retry - um blip TRANSITORIO de rede no SQL nesse instante deixava o
        # catalogo marcado com 0 layouts PARA SEMPRE (CatalogHealthCheck Unhealthy -> 503
        # permanente), mesmo com o SQL saudavel segundos depois. Corrigido em `develop` pelos
        # commits 2106075 (fix(catalog-warmup): retry com backoff no warm-up do cache, issue #67)
        # e d6532e3 (fix: classifica warm-up do catalogo em tres estados na readiness), PR #178 -
        # CatalogHealthCheck/CachePermanentWarmupBackgroundService agora distinguem estado
        # transitorio ("Aquecendo", recuperavel com retry/backoff progressivo dentro do proprio
        # warm-up) de definitivo ("Vazio", decryptor quebrado/config invalida - nao adianta retry).
        # O restart abaixo continua como rede de seguranca: mesmo com retry no warm-up, um SQL
        # fora do ar por tempo MAIOR que a janela de retry ainda deixa o estado definitivo ate
        # reiniciar o processo. [VALIDACAO PENDENTE 2026-08-21] runs de CI apos o merge do fix
        # (ex.: 32433130012, headSha 7245825, ancestral confirmado de d6532e3) AINDA falharam com
        # 503 persistente e "SqlException... error: 40" no host, mesmo apos o restart automatico -
        # ou seja, o retry/backoff nao cobre uma indisponibilidade de SQL mais longa que a janela
        # de tentativas. Isso pode ser um SQL genuinamente fora do ar (infra), nao um gap no fix -
        # investigar o log do host antes de assumir regressao. Se a causa raiz aqui precisar de
        # mudanca de codigo (ex.: janela de retry maior, ou distinguir "SQL fora" de "catalogo
        # vazio" na mensagem) -> @lp-backend-dev; aqui so mitigamos no nivel de deploy.
        function Test-Readiness {
          param([int]$Tentativas, [int]$EsperaSegundos)
          $statusLocal = $null
          for ($i = 1; $i -le $Tentativas; $i++) {
            $corpo = $null
            try {
              # TimeoutSec=10 (era 5): o pior caso do proprio SqlServerHealthCheck (Connection
              # Timeout=3 + Command Timeout=3, ate ~6s) e maior que os 5s antigos, o que confundia
              # "SQL um pouco lento" com "sem resposta". 10s da margem sem alargar a janela total
              # de tentativas (investigacao docs/architecture/investigacao-instabilidade-sql-deploy-2026-09-05.md).
              $resp = Invoke-WebRequest -Uri $smokeUrl -UseBasicParsing -TimeoutSec 10 -Headers $smokeHeaders
              $statusLocal = [int]$resp.StatusCode
              $corpo = $resp.Content
            } catch {
              $r = $_.Exception.Response
              $statusLocal = if ($r -and $r.StatusCode) { [int]$r.StatusCode } else { $null }
              if ($r) {
                try {
                  # GetResponseStream() pode vir vazio/fechado (WebException ja consumido pelo
                  # Invoke-WebRequest), o que fazia o corpo do 503 nunca aparecer no log (achado #4
                  # da investigacao 2026-09-05). $_.ErrorDetails.Message preserva o corpo em erro
                  # de forma confiavel no PowerShell 7 (pwsh, ja e o shell usado aqui) - tenta
                  # primeiro, cai no stream como fallback.
                  if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
                    $corpo = $_.ErrorDetails.Message
                  } else {
                    $stream = $r.GetResponseStream()
                    $reader = New-Object System.IO.StreamReader($stream)
                    $corpo = $reader.ReadToEnd()
                  }
                } catch { }
              }
            }

            if ($statusLocal -eq 200) {
              Write-Host "Smoke test: HTTP 200 em $smokeUrl (readiness OK, tentativa $i/$Tentativas)."
              return 200
            }

            $descr = if ($null -eq $statusLocal) { "sem resposta" } else { "HTTP $statusLocal" }
            Write-Host "  tentativa $i/$($Tentativas): readiness ainda nao pronta ($descr), aguardando ${EsperaSegundos}s..."
            # Corpo do /health/ready mostra QUAL dependencia esta Unhealthy (sql/redis/decryptor/
            # lowcode-runner/catalog) - sem isso so se descobre a causa lendo o log do host depois.
            if ($corpo) { Write-Host "    corpo: $corpo" }
            if ($i -lt $Tentativas) { Start-Sleep -Seconds $EsperaSegundos }
          }
          return $statusLocal
        }

        $status = Test-Readiness -Tentativas 24 -EsperaSegundos 5

        if ($status -ne 200) {
          Write-Warning ("Readiness nao ficou 200 na janela inicial (ultimo: " +
            $(if ($null -eq $status) { "sem resposta" } else { "HTTP $status" }) +
            "). Tentando UM restart do servico para reexecutar o warm-up do catalogo " +
            "(rede de seguranca alem do retry/backoff ja embutido no warm-up - cobre SQL fora do ar " +
            "por mais tempo que a janela de retry) e retestando...")
          Restart-Service -Name $serviceName -ErrorAction SilentlyContinue
          $svc = Get-Service -Name $serviceName
          $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          Start-Sleep -Seconds 8
          $status = Test-Readiness -Tentativas 24 -EsperaSegundos 5
        }

        if ($status -ne 200) {
          $ultimo = if ($null -eq $status) { "sem resposta" } else { "HTTP $status" }
          Write-Error "Readiness nao ficou 200 em $smokeUrl apos restart (ultimo: $ultimo). Deploy de dev abortado."
          exit 1
        }
        Write-Host "Deploy de dev concluido com sucesso."

    # -- Smoke test do runner low-code (NAO-FATAL, ruidoso) -----------------------
    # Mesmo racional do deploy.yml: o readiness so confere existencia do arquivo; este step roda
    # o runner em modo LIST posicional (<globalFolder> <package> LIST <in> <out>), que sobe o SDK
    # (InstanceFactory.Initialize + gate de licenca) e enumera o package, sem documento de entrada
    # nem os 48-137s de uma transformacao real. Exit 0 = runner apto no host.
    # Nao-fatal por ora - ver cabecalho equivalente no deploy.yml.
    - name: Smoke test do runner low-code (nao-fatal)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $runner = "$env:LOWCODE_RUNNER_PATH_RESOLVED"
        if ([string]::IsNullOrWhiteSpace($runner) -or -not (Test-Path $runner)) {
          Write-Warning "Runner low-code nao foi publicado neste deploy (LOWCODE_RUNNER_PATH_RESOLVED vazio) - nada a testar."
          exit 0
        }

        $globalFolder = Join-Path $env:DEPLOY_PATH_RESOLVED 'globalfolder'
        if (-not (Test-Path $globalFolder)) {
          Write-Warning "globalfolder nao encontrado em $globalFolder - LIST do runner nao pode rodar. Pathway low-code NAO validado."
          exit 0
        }

        $package = '938f9978-836f-48c1-9c0f-c2898caf4b20'
        $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
        $dummy = Join-Path $tmp 'lowcode-smoke-unused.txt'

        Write-Host "Rodando runner em modo LIST: $runner"
        $saida = & $runner $globalFolder $package 'LIST' $dummy $dummy 2>&1
        $code = $LASTEXITCODE
        $saida | ForEach-Object { Write-Host "    $_" }
        Write-Host "Runner LIST exit=$code"

        if ($code -eq 0) {
          Write-Host "Runner low-code SOBE no host (LIST enumerou o package sem erro de init)."
          exit 0
        }
        Write-Host ("ATENCAO: runner low-code NAO subiu (LIST exit=$code). execute-lowcode seguira " +
          "retornando 500 mesmo com o .exe publicado - provavel falha em InstanceFactory.Initialize() " +
          "ou globalfolder/package invalido. Deploy de dev NAO foi abortado (step nao-fatal).")
        if ($env:GITHUB_STEP_SUMMARY) {
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Runner low-code (dev): smoke test FALHOU (nao-fatal) - LIST exit=$code"
        }
        exit 0

    # -- Diagnostico de pre-requisitos (NAO-FATAL) -----------------------------------
    # Mesmo step do deploy.yml. Aqui ele responde pela maquina de dev; la, pelo servidor de
    # producao - que e a unica forma de responder, porque ninguem tem acesso de filesystem
    # ao .42 de fora. Nao falha o build: e instrumento de decisao, nao gate.
    - name: Diagnostico de pre-requisitos (nao-fatal)
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        try {
          $DEPLOY_PATH = $env:DEPLOY_PATH_RESOLVED

          Write-Host "=== 1) Runner low-code no destino ==="
          # Desde a issue #373 o runner e publicado em <deploy>\api\lowcode-runner\ (copia da pasta
          # Functions/ do repo). O caminho legado fica so como checagem historica.
          $runnerPath = Join-Path $DEPLOY_PATH 'api\lowcode-runner\LayoutParserLowCodeRunner.exe'
          $runnerLegado = Join-Path $DEPLOY_PATH 'api\LayoutParserLowCodeRunner.exe'
          if (Test-Path $runnerPath) {
            $info = Get-Item $runnerPath
            $l4n = Join-Path (Split-Path $runnerPath) 'log4net.dll'
            $l4nVer = if (Test-Path $l4n) { (Get-Item $l4n).VersionInfo.FileVersion } else { '(ausente)' }
            Write-Host "  PRESENTE: $runnerPath ($([math]::Round($info.Length / 1KB, 2)) KB, $($info.LastWriteTime), log4net $l4nVer)"
          } elseif (Test-Path $runnerLegado) {
            Write-Host "  PRESENTE (caminho legado): $runnerLegado - migrar para lowcode-runner\ no proximo deploy."
          } else {
            Write-Host "  AUSENTE: $runnerPath"
            Write-Host "  -> LowCode:RunnerPath aponta para um arquivo que nao existe; toda transformacao low-code falha."
            Write-Host "  -> Ver o step 'Publicar runner low-code (pasta Functions do repo)' - provavel Functions/ ausente/inapta no checkout."
          }

          Write-Host "=== 2) Bin do Sysmiddle apta a hospedar o runner ==="
          # [ATENCAO] Detecta pela DLL, NAO pelo nome da pasta. A versao anterior deste step procurava
          # literalmente por um diretorio 'AppConnector.DIR' e dava FALSO NEGATIVO: nesta maquina de
          # dev a instancia se chama C:\appconnector\App\Bin. O nome nao qualifica nada - o que
          # qualifica e ter SysMiddle.Base.dll com o log4net CERTO ao lado.
          #
          # O discriminador e a versao do log4net, e a diferenca e binaria (verificado 2026-08-10):
          #   C:\appconnector\App\Bin                     log4net 2.0.17.0  -> APTA (580 arquivos)
          #   <deploy>\api\Functions                      log4net 1.2.13.0  -> INVIAVEL
          # De Functions/ o runner estoura em InstanceFactory.Initialize() por divergencia de
          # assembly. Publicar o .exe na pasta errada produz falha em runtime, nao erro de deploy.
          $candidatas = New-Object System.Collections.Generic.List[string]
          $raizes = Get-ChildItem -Path 'C:\' -Directory -Force -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -notin @('Windows','Users','ProgramData','$Recycle.Bin','System Volume Information','Recovery') }
          foreach ($r in $raizes) {
            Get-ChildItem -Path $r.FullName -File -Recurse -Depth 4 -Filter 'SysMiddle.Base.dll' -ErrorAction SilentlyContinue |
              ForEach-Object { $candidatas.Add($_.DirectoryName) }
          }

          if ($candidatas.Count -eq 0) {
            Write-Host "  NENHUM SysMiddle.Base.dll encontrado (profundidade 4 nas raizes de C:\)."
            Write-Host "  -> Sem Bin do Sysmiddle, publicar o runner aqui NAO o faz executar: ele e"
            Write-Host "     net481/x86 e resolve dependencias pelo diretorio do proprio .exe."
          } else {
            foreach ($d in ($candidatas | Sort-Object -Unique)) {
              $l4n = Join-Path $d 'log4net.dll'
              $ver = if (Test-Path $l4n) { (Get-Item $l4n).VersionInfo.FileVersion } else { '(ausente)' }
              $qtd = (Get-ChildItem -Path $d -File -ErrorAction SilentlyContinue | Measure-Object).Count
              $apta = ($ver -like '2.*')
              Write-Host "  $d"
              Write-Host "     log4net: $ver | arquivos: $qtd | APTA: $apta"
            }
          }

          Write-Host "=== 3) Redis em localhost:6379 ==="
          $tcp = New-Object System.Net.Sockets.TcpClient
          $ok = $false
          try {
            $ok = $tcp.ConnectAsync('127.0.0.1', 6379).Wait(3000) -and $tcp.Connected
          } catch { $ok = $false } finally { $tcp.Dispose() }
          if ($ok) {
            Write-Host "  ACEITANDO CONEXAO - o cache Redis da API tende a subir normalmente."
          } else {
            Write-Host "  NAO respondeu em 3s."
            Write-Host "  -> A API sobe DEGRADADA (sem cache) e so reconecta se o processo reiniciar."
          }
          $svcRedis = Get-Service -Name '*redis*' -ErrorAction SilentlyContinue
          if ($svcRedis) {
            $svcRedis | ForEach-Object { Write-Host "  servico: $($_.Name) = $($_.Status)" }
          } else {
            Write-Host "  Nenhum servico Windows com 'redis' no nome."
          }
        } catch {
          Write-Warning "Diagnostico falhou (nao bloqueia o build): $($_.Exception.Message)"
        }
        exit 0
