name: Gitleaks (secret scan)

# PREVENCAO DE REINCIDENCIA - item 4 do plano de remediacao de 2026-08-15
# (.claude/rules/security.md, secao "2026-08-15 - rotacao da senha SQL descartada").
#
# POR QUE ESTE WORKFLOW EXISTE: a senha do SQL Server voltou ao repositorio em texto plano
# duas vezes (PR #7 em 2026-07-18, regressao ja documentada) porque alguem testou local com o
# segredo dentro do appsettings.json e o arquivo foi junto no commit. Como a senha e uma
# credencial compartilhada por ~231.890 times na NDD e NAO PODE ser rotacionada, o unico jeito
# de reduzir dano de uma proxima regressao e nunca deixar o segredo entrar no historico -
# disciplina sozinha ja falhou duas vezes, isto e o mecanismo tecnico.
#
# Roda em TODO PR (nao so contra master) para pegar o segredo o mais cedo possivel no fluxo
# feature -> develop -> master, antes que a exposicao se espalhe por mais de uma branch.
# Mesma ferramenta (gitleaks) que o @lp-backend-dev esta configurando como hook local de
# pre-commit em paralelo - consistencia deliberada, mesmo padrao de deteccao dos dois lados.
#
# Roda em runner hospedado (ubuntu-latest), como o merge-gate.yml: e leitura/scan, sem tocar
# infra de producao/dev, sem precisar do runner self-hosted.

on:
  pull_request:
    branches:
      - develop
      - master
      - main

concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historico completo do PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 (a Action oficial "wrapper") passou a exigir
      # GITLEAKS_LICENSE para repositorios de ORGANIZACAO - so e gratuita para conta
      # pessoal/individual, independente do repo ser publico ou privado. Mesma classe de
      # problema resolvida hoje com o CodeQL (trocado por SecurityCodeScan, gratuito):
      # aqui trocamos a Action pelo BINARIO gitleaks direto via CLI, que nao tem essa
      # exigencia - e so o scanner open-source, sem telemetria/licenca nenhuma.
      - name: Instalar gitleaks (binario oficial, sem licenca)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Comportamento equivalente ao da Action: escaneia apenas os commits introduzidos
      # pelo PR (diff contra a base), nao o historico inteiro do repo. Bloqueia o job (e
      # portanto o merge, se marcado como required check) se achar padrao de segredo:
      # connection string com senha, API key, token, chave privada etc. Usa o mesmo
      # .gitleaks.toml (PR #123).
      - name: Gitleaks - scan do diff do PR
        run: |
          set -euo pipefail
          # BUG CORRIGIDO (2026-08-17, ver docs/architecture/triagem-gitleaks-segredos-historicos-2026-08-17.md):
          # o checkout acima ja e fetch-depth: 0 (historico completo do PR), mas o
          # `git fetch origin <base> --depth=1` que existia aqui criava um segundo fetch RASO
          # do branch base, sem historico comum com o HEAD do checkout. Isso quebrava a
          # resolucao do range `origin/<base>..HEAD` (merge-base nao encontrado), e o
          # `gitleaks detect` caia no fallback de escanear o historico inteiro (110 commits)
          # em vez de so o diff da PR - foi isso que bloqueou o merge de hoje com achados
          # historicos ja tratados. Fix: sem --depth, o fetch aproveita o historico completo
          # que o checkout ja trouxe e so atualiza a ref local origin/<base>.
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          gitleaks detect \
            --source . \
            --log-opts="--no-merges --first-parent origin/${{ github.event.pull_request.base.ref }}..HEAD" \
            --config .gitleaks.toml \
            --redact \
            --verbose
